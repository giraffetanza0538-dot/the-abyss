<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ABYSS - 深層心理の深淵</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #aa0000;
            --text-color: #c0c0c0;
            --card-bg: #111;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
        }
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            z-index: 100;
            background-size: 100% 3px;
            pointer-events: none;
        }
        #app { width: 90%; max-width: 700px; z-index: 10; padding: 20px; }
        .screen { background: var(--card-bg); border: 1px solid #333; padding: 40px; box-shadow: 0 0 50px rgba(0,0,0,1); position: relative; }
        h1 { color: var(--accent-color); text-align: center; letter-spacing: 8px; font-size: 2.5rem; margin-bottom: 40px; }
        .question-text { font-size: 1.2rem; line-height: 1.8; min-height: 120px; margin-bottom: 40px; }
        .btn-container { display: flex; gap: 20px; }
        button { flex: 1; background: transparent; color: #888; border: 1px solid #444; padding: 15px; cursor: pointer; font-family: inherit; text-transform: uppercase; transition: 0.3s; }
        button:hover { color: var(--accent-color); border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-color); }
        .result-img { width: 100%; height: 350px; background: #000; margin-bottom: 20px; border: 1px solid #444; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .result-img img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) sepia(0.5) contrast(1.2) brightness(0.7); }
        .type-title { color: var(--accent-color); font-size: 2.2rem; margin-bottom: 20px; text-align: center; }
        .section-title { color: #888; font-size: 0.8rem; margin-top: 20px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .section-content { font-size: 0.95rem; line-height: 1.6; color: #bbb; margin-bottom: 15px; padding-top: 5px; }
        .hidden { display: none; }
        #bgm-controls { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
        #bgm-controls button { padding: 5px 10px; font-size: 0.7rem; border-radius: 0; }
    </style>
</head>
<body>

<audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg">
</audio>
<div id="bgm-controls">
    <button id="bgm-btn" onclick="toggleBGM()">AUDIO: OFF</button>
</div>

<div id="app">
    <div id="start-screen" class="screen">
        <h1>THE ABYSS</h1>
        <p style="text-align: center; color: #666; margin-bottom: 40px;">
            [ システム警告 ]<br>
            これより先は、あなたの良心をバイパスし、<br>
            深層に眠る「不都合な真実」を抽出します。
        </p>
        <button onclick="startQuiz()" style="width: 100%; color: var(--accent-color); border-color: var(--accent-color);">スキャンを開始する</button>
    </div>

    <div id="quiz-screen" class="screen hidden">
        <div id="q-number" style="font-size: 0.7rem; color: #555; margin-bottom: 10px;"></div>
        <div class="question-text" id="q-text"></div>
        <div class="btn-container">
            <button onclick="answer(true)">[ YES ]</button>
            <button onclick="answer(false)">[ NO ]</button>
        </div>
    </div>

    <div id="loading-screen" class="screen hidden">
        <div id="load-msg" style="text-align: center; color: var(--accent-color); font-size: 1.2rem;"></div>
    </div>

    <div id="result-screen" class="screen hidden">
        <div class="result-img" id="result-img-container">
            <img id="res-img" src="" alt="">
        </div>
        <div id="res-type" class="type-title"></div>
        
        <div class="section-title">キャッチコピー</div>
        <div id="res-catch" class="section-content" style="color: #fff; font-weight: bold;"></div>

        <div class="section-title">コア解説</div>
        <div id="res-core" class="section-content"></div>

        <div class="section-title">思考パターン</div>
        <div id="res-thought" class="section-content"></div>

        <div class="section-title">強み</div>
        <div id="res-strength" class="section-content"></div>

        <div class="section-title">リスク</div>
        <div id="res-risk" class="section-content"></div>

        <div class="section-title">活かし方</div>
        <div id="res-usage" class="section-content"></div>

        <div class="section-title">シェア用トリガー</div>
        <div id="res-trigger" class="section-content" style="background: #000; padding: 10px; border: 1px dashed #444;"></div>

        <button onclick="location.reload()" style="width: 100%; margin-top: 30px;">記録を抹消して戻る</button>
    </div>
</div>

    const typeData = {
        "MS": { name: "情報詐欺師", catch: "あなたの真実は、私が今決めた。", core: "言葉の魔術師。相手が信じたい物語を即座に提供できる。", thought: "事実はどうでもいい。相手がどう動くかが全て。", strength: "交渉、マーケティング、絶望を希望に見せかける力。", risk: "自分の嘘に飲み込まれ、現実との境界を失う。", usage: "ビジョナリーとして。実務は誠実な者に任せよ。", trigger: "私の嘘は、世界を救うための魔法だったらしい。" },

        "SE": { name: "見えない窃盗犯", catch: "あなたが失ったもの、私が有効活用してあげる。", core: "気づかぬうちに他人の時間や手柄を搾取する寄生型才能。", thought: "余っているリソースを貰って何が悪い？", strength: "コスト意識、サバイバル能力。無駄のない立ち回り。", risk: "周囲から徐々に人が離れ、最後には誰も助けない。", usage: "資産運用、バックオフィス。最小投資で最大益を狙え。", trigger: "あなたの手柄は、今日から私の実績です。" },

    function startQuiz() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

    }

    function showQ() {
        const q = questions[currentIdx];
        const el = document.getElementById('q-text');
        document.getElementById('q-number').innerText = `NODE [ ${currentIdx + 1} / 50 ] SCANNING...`;
        el.innerText = q.t;
    }

    function answer(isYes) {
        if(isYes) {
            const f = questions[currentIdx].f;
            for(let k in f) scores[k] += f[k];
        }
        currentIdx++;
        if(currentIdx < questions.length) showQ();
        else processResult();
    }

    function processResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('loading-screen').classList.remove('hidden');
        const msg = document.getElementById('load-msg');
        const logs = ["神経網をスキャン...", "倫理回路をバイパス...", "深層の衝動を抽出...", "解析完了。"];
        let i = 0;
        const interval = setInterval(() => {
            msg.innerText = logs[i];
            i++;
            if(i >= logs.length) {
                clearInterval(interval);
                setTimeout(displayFinal, 1000);
            }
        }, 1200);
    }

    function displayFinal() {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
        const key = sorted[0][0] + sorted[1][0];
        const data = typeData[key] || typeData["MS"];

        document.getElementById('res-type').innerText = data.name;
        document.getElementById('res-catch').innerText = data.catch;
        document.getElementById('res-core').innerText = data.core;
        document.getElementById('res-thought').innerText = data.thought;
        document.getElementById('res-strength').innerText = data.strength;
        document.getElementById('res-risk').innerText = data.risk;
        document.getElementById('res-usage').innerText = data.usage;
        document.getElementById('res-trigger').innerText = data.trigger;
        document.getElementById('res-img').src = `images/${key}.jpg`; // imagesフォルダ内の画像を参照
    }
</script>
</body>
</html>
