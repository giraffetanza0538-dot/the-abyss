<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ABYSS - 深層心理の深淵</title>
    <style>
        :root {
            --bg-color: #030303;
            --accent-color: #aa0000;
            --text-color: #d0d0d0;
            --card-bg: rgba(10, 10, 10, 0.98);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', 'Arial', 'Hiragino Sans', 'Meiryo', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 1000;
            background-size: 100% 3px;
            pointer-events: none;
        }
        #app { width: 95%; max-width: 850px; z-index: 10; padding: 20px; }
        .screen { background: var(--card-bg); border: 1px solid #333; padding: 40px; box-shadow: 0 0 80px rgba(170, 0, 0, 0.15); }
        h1 { color: var(--accent-color); text-align: center; letter-spacing: 12px; font-size: 2.5rem; margin-bottom: 40px; text-shadow: 0 0 10px rgba(170, 0, 0, 0.5); }
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .q-number { font-size: 0.9rem; color: var(--accent-color); font-weight: bold; letter-spacing: 2px; }
        .question-text { font-size: 1.3rem; line-height: 2.2; min-height: 160px; margin-bottom: 40px; color: #eee; }
        .btn-container { display: flex; gap: 20px; }
        button { flex: 1; background: transparent; color: #888; border: 1px solid #444; padding: 20px; cursor: pointer; font-family: inherit; font-size: 1.1rem; transition: 0.4s; }
        button:hover { color: var(--accent-color); border-color: var(--accent-color); background: rgba(170,0,0,0.1); }
        .result-img { width: 100%; height: 450px; background: #000; margin-bottom: 30px; border: 1px solid #444; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .result-img img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(0.6) contrast(1.4); }
        .type-title { color: var(--accent-color); font-size: 2.8rem; margin-bottom: 10px; text-align: center; font-weight: bold; }
        .type-subtitle { color: #888; text-align: center; margin-bottom: 40px; font-size: 1.1rem; letter-spacing: 2px; }
        .section-title { color: #fff; font-size: 1rem; margin-top: 40px; background: linear-gradient(90deg, var(--accent-color), transparent); padding: 5px 15px; letter-spacing: 2px; font-weight: bold; }
        .section-content { font-size: 1.05rem; line-height: 2; color: #bbb; margin-bottom: 20px; padding: 15px 5px; text-align: justify; }
        #final-message { margin-top: 80px; padding: 50px; border: 2px solid var(--accent-color); background: rgba(20, 0, 0, 0.95); display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<audio id="bgm" loop preload="auto"><source src="bgm.mp3" type="audio/mpeg"></audio>

<div id="app">
    <div id="start-screen" class="screen">
        <h1>THE ABYSS</h1>
        <p style="text-align: center; color: #888; margin-bottom: 40px; line-height: 2;">
            [ SYSTEM NOTIFICATION ]<br>
            これよりあなたの脳内領域へアクセスし、50のプロトコルを走らせます。<br>
            社会的バイアスを排除し、直感のみで応答してください。<br>
            あなたの「本性」が暴かれるまで、残り50問。
        </p>
        <button onclick="startQuiz()">システムを起動する</button>
    </div>

    <div id="quiz-screen" class="screen hidden">
        <div class="q-header">
            <div class="q-number" id="q-number"></div>
            <div style="font-size: 0.7rem; color: #444;">STATUS: SCANNING...</div>
        </div>
        <div class="question-text" id="q-text"></div>
        <div class="btn-container">
            <button onclick="handleAnswer(true)">YES (肯定)</button>
            <button onclick="handleAnswer(false)">NO (否定)</button>
        </div>
    </div>

    <div id="loading-screen" class="screen hidden">
        <div id="load-msg" style="text-align: center; color: var(--accent-color); font-size: 1.2rem; letter-spacing: 5px;"></div>
    </div>

    <div id="result-screen" class="screen hidden">
        <div class="result-img"><img id="res-img" src="" alt=""></div>
        <div id="res-type" class="type-title"></div>
        <div id="res-catch" class="type-subtitle"></div>
        
        <div class="section-title">■ 深層心理プロファイル</div>
        <div id="res-core" class="section-content"></div>
        
        <div class="section-title">■ 社会的仮面（ペルソナ）と裏の顔</div>
        <div id="res-persona" class="section-content"></div>

        <div class="section-title">■ 人間関係における支配傾向</div>
        <div id="res-relation" class="section-content"></div>

        <div class="section-title">■ 闇の適職と成功への鍵</div>
        <div id="res-career" class="section-content"></div>

        <div class="section-title">■ 破滅のトリガー</div>
        <div id="res-risk" class="section-content"></div>

        <div id="final-message">
            <div style="color: var(--accent-color); font-weight: bold; margin-bottom: 25px; text-align: center; font-size: 1.3rem;">【深淵からの手紙：あなたの影への総評】</div>
            <div id="final-text" style="font-size: 1rem; line-height: 2.2; color: #ccc;"></div>
        </div>

        <button id="reset-btn" onclick="location.reload()" style="width: 100%; margin-top: 60px; display: none;">全データを破棄して離脱する</button>
    </div>
</div>

<script>
    // 因子定義：M(操作力), E(共感欠如), D(支配欲), C(混沌・破壊), S(潜伏・偽装)
    const questions = [
        { t: "友人の不幸を聞いた時、表面上は同情するが、内心では「自分は安全だ」という強烈な安堵と優越感を覚える。", f: {E:1, D:0.5} },
        { t: "他人の涙を見ても、共感するよりも先に「この涙は演技か、それとも計算か」と冷ややかに疑ってしまう。", f: {E:1, M:1} },
        { t: "誰かを助ける時、その行為が将来的に自分へどれほどの利益をもたらすかを、無意識に計算している。", f: {M:1, S:0.5} },
        { t: "能力の低い者が苦境に立たされても、それは自己責任であり、救済は社会の進化を妨げる不要なノイズだと確信している。", f: {E:1, D:0.5} },
        { t: "「ルール」や「道徳」は、思考を放棄した凡人を管理するために用意された家畜用の柵に過ぎないと思う。", f: {M:1, C:1} },
        { t: "目的を達成するためなら、情報の隠蔽や小さな改竄（かいざん）は「戦略的最適化」であり、躊躇する必要はない。", f: {M:1, S:0.5} },
        { t: "鏡に向き合うとき、そこに映る自分は「何者にもなりうる役者」であり、真の素顔など存在しないと感じる。", f: {S:1, M:1} },
        { t: "激しい怒りを感じた時、相手の心が再起不能になるまで、言葉の刃で徹底的に破壊し尽くしたいという渇望がある。", f: {C:1, E:1} },
        { t: "他人が自分を褒め称えるのは当然の義務であり、周囲の人間は自分を輝かせるための装置であるべきだ。", f: {D:1, E:0.5} },
        { t: "集団の中で孤立している人間を見ても、自分がターゲットでない限り、その状況を冷めた視線で傍観できる。", f: {E:1} },
        { t: "自分のミスを他人のせいにした時、良心の呵責よりも「うまく難を逃れた」という知的な爽快感の方が大きい。", f: {M:1, S:1} },
        { t: "会話の主導権を握り、相手の思考や反応を自らの意図通りにコントロールすることに、至上の悦びを感じる。", f: {D:1, M:1} },
        { t: "「誠実」や「絆」という言葉を聞くと、それが弱者を繋ぎ止めるための甘い罠のように感じてならない。", f: {E:1, C:0.5} },
        { t: "どれほど親しい相手であっても、自らの利益と相反する瞬間に、躊躇なくその縁を切り捨てる自信がある。", f: {E:1, M:1} },
        { t: "平穏な日常は精神的な死と同じだ。常に何らかの混乱やリスク、あるいは破壊の予感がないと満足できない。", f: {C:1, D:0.5} },
        { t: "他人の秘密を握ることは、自分を優位に立たせるための最も効率的な「弾薬」を手に入れることだ。", f: {M:1, D:0.5} },
        { t: "SNSでの他人の不幸や炎上事件は、自分にとって最高の娯楽の一つである。", f: {E:1, C:1} },
        { t: "相手によって声のトーンや振る舞いを完璧に演じ分けており、どの自分が本物なのか確信が持てない。", f: {S:1, M:1} },
        { t: "自分が注目を浴びていない集まりは時間の無駄であり、すぐにでも立ち去りたくなる。", f: {D:1, S:0.5} },
        { t: "「バレなければ何をしてもいい」という考え方は、生物学的に見て極めて合理的な判断であると思う。", f: {M:1, E:1} },
        { t: "自分のアドバイスで他人の人生が変わるのを見て、神にでもなったかのような全能感を覚えたことがある。", f: {D:1, M:1} },
        { t: "法律のグレーゾーンを歩くとき、捕まらないスリルよりも「凡人にはできない芸当をしている」という自負に燃える。", f: {M:1, C:1} },
        { t: "誰かを褒めるのは、その相手を思い通りに動かすための「餌」を与えている感覚に近い。", f: {M:1, D:1} },
        { t: "過去の話をするとき、自分をより優位に見せるために事実を脚色するが、それは自己演出の一環だ。", f: {D:1, S:1} },
        { t: "自分は他の誰よりも特別な運命を背負った「選ばれし者」であると、心の奥底で信じている。", f: {D:1, C:0.5} },
        { t: "失敗した人を励ますふりをしながら、内心ではその人物の無能さを嘲笑っている。", f: {E:1, D:0.5} },
        { t: "禁止されている場所や行為ほど、その背徳感に抗いがたい魅力を感じて、実行に移してしまう。", f: {C:1, M:0.5} },
        { t: "他人の人生が狂うような噂話を、あえて善意を装って周囲に広めることに快感を覚える。", f: {M:1, E:1} },
        { t: "自分の領域に踏み込んでくる人間は、たとえ家族であっても「不快な侵入者」として排除したくなる。", f: {D:1, E:1} },
        { t: "約束や規律を守ることよりも、その瞬間の自分の気分や直感に従う方が重要である。", f: {C:1, S:0.5} },
        { t: "自分の美学に反するものは、たとえ社会的に正しいとされることでも徹底的に拒絶する。", f: {C:1, D:1} },
        { t: "人の弱みを握ると、安心感と同時に「いつこれを切り札にしようか」という期待が込み上げる。", f: {M:1, D:1} },
        { t: "常に最悪の事態を想定し、周囲の人間を自分を守るための「盾」としてどう配置するかを考えている。", f: {S:1, M:1} },
        { t: "自分が犯した間違いを指摘されると、相手が誰であれ殺意に近い激しい拒絶感を覚える。", f: {D:1, E:1} },
        { t: "感情的に取り乱しているふりをして相手を困惑させ、状況を有利に運んだことがある。", f: {S:1, M:1} },
        { t: "他人が苦労して築き上げたものを、一瞬で無に帰すような破壊衝動に襲われることがある。", f: {C:1, E:1} },
        { t: "「愛」や「友情」よりも、「利害関係」や「貸し借り」の方が遥かに信頼できる繋がりである。", f: {E:1, M:1} },
        { t: "自分を批判する人間は、その正当性に関係なく、この世から消え去るべき存在だと感じる。", f: {D:1} },
        { t: "世の中の不平等は、優れた者が富と権力を独占するための正当なシステムであると思う。", f: {D:1, E:0.5} },
        { t: "初対面の相手を、自分より「強者」か「弱者」かで、一瞬のうちにランク付けしている。", f: {D:1, M:0.5} },
        { t: "他人のアイデアを自らのものとして発表し、称賛を浴びることに何の躊躇も感じない。", f: {M:1, S:0.5} },
        { t: "自分が不在の場所で楽しい計画が進んでいると、猛烈な疎外感と激しい嫉妬を覚える。", f: {S:1, D:1} },
        { t: "人の顔色を伺うのが得意すぎて、相手が今どんな言葉を欲しがっているかが手に取るようにわかる。", f: {S:1} },
        { t: "孤独であることは強さの証であり、他人に頼ることは魂の敗北であると感じる。", f: {D:1, C:0.5} },
        { t: "自分にしか分からない「毒」を言葉に混ぜ、相手を精神的にじわじわと追い詰めることに喜びを感じる。", f: {E:1, M:1} },
        { t: "どれだけ贅沢をしても満たされず、常に他人が持っている「より良いもの」を奪いたくなる。", f: {D:1, M:1} },
        { t: "この世界そのものが壮大なシミュレーションであり、自分以外はすべて虚像のように感じることがある。", f: {E:1, D:1} },
        { t: "自分の死後、この世界がどうなろうと知ったことではない。むしろ、道連れに滅びてほしいとすら思う。", f: {C:1, E:1} },
        { t: "たとえ地獄に落ちるとしても、他人を屈服させて王として君臨する道を選びたい。", f: {D:1, M:1} },
        { t: "今の質問に応えている自分さえも、誰かを欺くための偽りの姿であると感じている。", f: {S:1, M:1} }
    ];

    const typeData = {
        "MS": {
            name: "情報詐欺師 (Mirage Architect)",
            catch: "「真実とは、最も巧妙に編まれた嘘の別称に過ぎない。」",
            core: "あなたは事実という粘土を使い、他者が望む『心地よい幻想』を造り上げる天才です。世界をデータではなく『印象』として捉え、言葉一つで大衆を熱狂させる力を持っています。その知性は、常に自己の優位性を保つための武器として研ぎ澄まされています。",
            persona: "知的で魅力的な人物を演じますが、その内面には冷徹な計算機が鎮座しています。他者の欲求を瞬時に見抜き、相手が鏡を見ているかのような錯覚を与える共感を演出します。",
            relation: "相手を「依存させる」か「利用する」かの二択です。信頼を勝ち取る技術は超一流ですが、あなた自身が誰も信じていないため、関係が深まると自ら破壊するような冷酷さを持ちます。",
            career: "戦略コンサルタント、カリスマ指導者、黒幕。既存の価値観を無力化し、自らが作ったルールを信じ込ませる領域で君臨します。",
            risk: "嘘を積み重ねるうちに、自分自身の本当の欲望さえもが「他人の借り物」のように感じられる深刻な自己喪失に陥るリスクがあります。"
        },
        "ED": {
            name: "評判の暗殺者 (Reputation Assassin)",
            catch: "「正義という名の剣は、抜く前に相手を殺している。」",
            core: "他者の綻びや罪悪感を見逃さない、冷酷な審判者です。法や倫理を盾として持ち、自分を「正しい側」に置いたまま、相手の社会的基盤をじわじわと侵食し、破壊することに長けています。",
            persona: "「公平」「規律」を体現したような、非の打ち所のない人物を装います。他者の欺瞞を許さない厳しい姿勢は周囲に畏怖を与え、逆らえない空気を作り出します。",
            relation: "周囲を常に監視し、ランク付けしています。他者はあなたに「間違いを犯してはいけない」という強い圧迫感を感じ、従順な駒へと変わっていきます。",
            career: "内部監査、検察官、批評家。他者の不備を暴き、排除することがシステム全体の利益に繋がるような地位で無慈悲な成功を収めます。",
            risk: "他人の欠点を探し続けるあまり、自らの孤独から目を逸らし続け、最終的には自ら定めた『完璧なルール』という監獄に閉じ込められます。"
        },
        "MC": {
            name: "思考の海賊 (Cognitive Pirate)",
            catch: "「あなたの記憶も、あなたの思想も、元は私の持ち物だ。」",
            core: "他者の独創的なアイデアや記憶を盗み取り、自らの血肉とする精神的略奪者です。混沌とした状況を好み、あえて情報を攪乱することで、人々が思考停止に陥った隙にその精神的主導権を奪い去ります。",
            persona: "奔放で天才肌な人物に見えますが、その言動はすべて計算されています。他人の成功を横取りする際も、「自分こそが真の理解者である」という物語を捏造します。",
            relation: "他者の才能を搾取する関係を築きます。相手が自分なしでは思考できないように、精神的な依存状態を作り出すことに長けています。",
            career: "クリエイティブ・ディレクター、煽動家。既存の概念を破壊し、他人の功績を自分の色に塗り替える分野で異彩を放ちます。",
            risk: "奪い取ったもので自分を飾り立てるため、内面は常に空虚です。真のオリジナリティを突きつけられた時、激しい劣等感で崩壊します。"
        },
        "SE": {
            name: "見えない窃盗犯 (Invisible Thief)",
            catch: "「失ったことさえ気づかないうちに、すべては私の手の中にある。」",
            core: "静寂の中に潜み、他者が最も大切にしている感情や機会を、気付かれぬうちに奪い去る潜伏型の捕食者です。派手な破壊ではなく、綻びを広げて中身を空にするような、静かな略奪を好みます。",
            persona: "影が薄く、害のない善良な人間を演じます。集団の中で目立たず、しかし常に「最も美味しい場所」を確保する立ち回りに特化しています。",
            relation: "深い関わりを避けつつ、相手の弱みを握ります。恩を売るのではなく、相手が「自分は何かを失った」と気づく頃には、あなたは既に姿を消しています。",
            career: "スパイ、情報仲介人、裏社会の会計士。目立たずに莫大な利益を上げる、黒衣のプロフェッショナルとして成功します。",
            risk: "存在を消し続けるあまり、誰からも認識されないという究極の孤独に陥ります。現実との接点を失い、自らも透明な幽霊となって消える恐怖があります。"
        },
        "DS": {
            name: "深淵の独裁者 (Abyss Dictator)",
            catch: "「自由とは、私に従うという選択肢のことだ。」",
            core: "目に見えない糸で大衆を操る、影の統治者です。暴力ではなく、恐怖と依存を巧妙にブレンドした支配体制を築きます。あなたの前では、どんな強者も自ら首輪を差し出すことになります。",
            persona: "威風堂々としたリーダーシップと、時折見せる冷徹な慈悲。他者に「この人についていくしかない」と思わせる、抗いがたいカリスマ性を放ちます。",
            relation: "完全なる縦の関係を求めます。対等な友人は存在せず、周囲にいるのは信者か、利用価値のある道具か、排除すべき敵のいずれかです。",
            career: "独裁的な経営者、カルト的政治家、宗教指導者。人々の不安を食い物にし、絶対的な秩序を作り上げる分野で頂点に立ちます。",
            risk: "反逆を恐れるあまり、猜疑心の塊となります。誰も信じられない孤独の中で、自らが築いた帝国の重みに押し潰されることになります。"
        },

    let currentIdx = 0;
    let scores = { M: 0, E: 0, D: 0, C: 0, S: 0 };

    function startQuiz() {
        document.getElementById('bgm').play().catch(()=>{});
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQ();
    }

    function showQ() {
        const q = questions[currentIdx];
        const el = document.getElementById('q-text');
        document.getElementById('q-number').innerText = `PROTOCOL NO. ${String(currentIdx + 1).padStart(2, '0')} / 50`;
        
        el.innerText = "";
        let i = 0;
        const timer = setInterval(() => {
            el.innerText += q.t.charAt(i);
            i++;
            if (i >= q.t.length) clearInterval(timer);
        }, 30);
    }

    function handleAnswer(isYes) {
        if(isYes) {
            const f = questions[currentIdx].f;
            for(let k in f) scores[k] += f[k];
        }
        currentIdx++;
        if(currentIdx < questions.length) showQ();
        else processResult();
    }

    function processResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('loading-screen').classList.remove('hidden');
        const msg = document.getElementById('load-msg');
        const logs = ["倫理回路をシャットダウン中...", "潜在的犯罪因子の定量化中...", "社会的ペルソナの完全解析中...", "深淵との同期が完了しました。"];
        let i = 0;
        const interval = setInterval(() => {
            msg.innerText = logs[i];
            i++;
            if(i >= logs.length) {
                clearInterval(interval);
                setTimeout(displayFinal, 1200);
            }
        }, 1200);
    }

    function displayFinal() {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
        const key = sorted[0][0] + (sorted[1] ? sorted[1][0] : sorted[0][0]);
        const data = typeData[key] || typeData["MS"];

        document.getElementById('res-type').innerText = data.name;
        document.getElementById('res-catch').innerText = data.catch;
        document.getElementById('res-core').innerText = data.core;
        document.getElementById('res-persona').innerText = data.persona;
        document.getElementById('res-relation').innerText = data.relation;
        document.getElementById('res-career').innerText = data.career;
        document.getElementById('res-risk').innerText = data.risk;
        document.getElementById('res-img').src = `images/${key}.jpg`;

        setTimeout(() => {
            document.getElementById('final-message').style.display = 'block';
            typeFinalText();
        }, 1500);
    }

    function typeFinalText() {
        const text = `診断お疲れ様でした。あなたが直視したその姿は、社会があなたに押し付けた「善人」という化けの皮を剥ぎ取った、魂の原型です。\n\nこのアビス（深淵）が示したのは、あなたが窮地に立たされた時に発動する「真の生存戦略」に他なりません。悪と呼ばれようと、闇と呼ばれようと、それはあなたがこの残酷な世界を生き抜くために獲得した最強の武器なのです。\n\n【警告】\n自らの影を制御できない者は、いつかその影に呑まれます。しかし、自らの影を知り、それを意図的に使いこなす者は、光の届かない場所から世界を支配することができるでしょう。\n\nさあ、その特別な「牙」を持って、外の世界に戻りなさい。次にその仮面を外すのは、誰かを仕留める時かもしれませんね。`;
        const el = document.getElementById('final-text');
        let i = 0;
        const timer = setInterval(() => {
            if (text.charAt(i) === '\n') el.innerHTML += '<br>';
            else el.innerHTML += text.charAt(i);
            i++;
            if (i >= text.length) {
                clearInterval(timer);
                document.getElementById('reset-btn').style.display = 'block';
            }
        }, 40);
    }
