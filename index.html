<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ABYSS - 深層心理の深淵</title>
    <style>
        :root {
            --bg-color: #030303;
            --accent-color: #aa0000;
            --text-color: #d0d0d0;
            --card-bg: rgba(10, 10, 10, 0.98);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', 'Arial', 'Hiragino Sans', 'Meiryo', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 1000;
            background-size: 100% 3px;
            pointer-events: none;
        }
        #app { width: 95%; max-width: 850px; z-index: 10; padding: 20px; }
        .screen { background: var(--card-bg); border: 1px solid #333; padding: 40px; box-shadow: 0 0 80px rgba(170, 0, 0, 0.15); }
        h1 { color: var(--accent-color); text-align: center; letter-spacing: 12px; font-size: 2.5rem; margin-bottom: 40px; text-shadow: 0 0 10px rgba(170, 0, 0, 0.5); }
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .q-number { font-size: 0.9rem; color: var(--accent-color); font-weight: bold; letter-spacing: 2px; }
        .question-text { font-size: 1.3rem; line-height: 2.2; min-height: 160px; margin-bottom: 40px; color: #eee; }
        .btn-container { display: flex; gap: 20px; }
        button { flex: 1; background: transparent; color: #888; border: 1px solid #444; padding: 20px; cursor: pointer; font-family: inherit; font-size: 1.1rem; transition: 0.4s; }
        button:hover { color: var(--accent-color); border-color: var(--accent-color); background: rgba(170,0,0,0.1); }
        .result-img { width: 100%; height: 450px; background: #000; margin-bottom: 30px; border: 1px solid #444; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .result-img img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(0.6) contrast(1.4); }
        .type-title { color: var(--accent-color); font-size: 2.8rem; margin-bottom: 10px; text-align: center; font-weight: bold; }
        .type-subtitle { color: #888; text-align: center; margin-bottom: 40px; font-size: 1.1rem; letter-spacing: 2px; }
        .section-title { color: #fff; font-size: 1rem; margin-top: 40px; background: linear-gradient(90deg, var(--accent-color), transparent); padding: 5px 15px; letter-spacing: 2px; font-weight: bold; }
        .section-content { font-size: 1.05rem; line-height: 2; color: #bbb; margin-bottom: 20px; padding: 15px 5px; text-align: justify; }
        #final-message { margin-top: 80px; padding: 50px; border: 2px solid var(--accent-color); background: rgba(20, 0, 0, 0.95); display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<audio id="bgm" loop preload="auto"><source src="bgm.mp3" type="audio/mpeg"></audio>

<div id="app">
    <div id="start-screen" class="screen">
        <h1>THE ABYSS</h1>
        <p style="text-align: center; color: #888; margin-bottom: 40px; line-height: 2;">
            [ SYSTEM NOTIFICATION ]<br>
            これよりあなたの脳内領域へアクセスし、50のプロトコルを走らせます。<br>
            社会的バイアスを排除し、直感のみで応答してください。<br>
            あなたの「真実」が暴かれるまで、残り50問。
        </p>
        <button onclick="startQuiz()">システムを起動する</button>
    </div>

    <div id="quiz-screen" class="screen hidden">
        <div class="q-header">
            <div class="q-number" id="q-number"></div>
            <div style="font-size: 0.7rem; color: #444;">STATUS: SCANNING...</div>
        </div>
        <div class="question-text" id="q-text"></div>
        <div class="btn-container">
            <button onclick="handleAnswer(true)">YES (肯定)</button>
            <button onclick="handleAnswer(false)">NO (否定)</button>
        </div>
    </div>

    <div id="loading-screen" class="screen hidden">
        <div id="load-msg" style="text-align: center; color: var(--accent-color); font-size: 1.2rem; letter-spacing: 5px;"></div>
    </div>

    <div id="result-screen" class="screen hidden">
        <div class="result-img"><img id="res-img" src="" alt=""></div>
        <div id="res-type" class="type-title"></div>
        <div id="res-catch" class="type-subtitle"></div>
        
        <div class="section-title">■ 深層心理プロファイル</div>
        <div id="res-core" class="section-content"></div>
        
        <div class="section-title">■ 社会的仮面（ペルソナ）と裏の顔</div>
        <div id="res-persona" class="section-content"></div>

        <div class="section-title">■ 人間関係における支配傾向</div>
        <div id="res-relation" class="section-content"></div>

        <div class="section-title">■ 闇の適職と成功への鍵</div>
        <div id="res-career" class="section-content"></div>

        <div class="section-title">■ 破滅のトリガー</div>
        <div id="res-risk" class="section-content"></div>

        <div id="final-message">
            <div style="color: var(--accent-color); font-weight: bold; margin-bottom: 25px; text-align: center; font-size: 1.3rem;">【深淵からの手紙：あなたの影への総評】</div>
            <div id="final-text" style="font-size: 1rem; line-height: 2.2; color: #ccc;"></div>
        </div>

        <button id="reset-btn" onclick="location.reload()" style="width: 100%; margin-top: 60px; display: none;">全データを破棄して終了する</button>
    </div>
</div>

<script>
    const questions = [
        { t: "友人の不幸を聞いた時、表面上は同情するが、内心では「自分は安全だ」という強烈な安堵と優越感を感じる。", f: {E:1, M:0.5} },
        { t: "他人の涙を見ても、共感するよりも先に「この涙は演技か、それとも計算か」と疑ってしまう。", f: {E:1, M:1} },
        { t: "誰かを助ける時、その行為が将来的に自分にどれほどの利益をもたらすかを無意識に計算している。", f: {M:1, S:0.5} },
        { t: "能力の低い者が苦境に立たされても、それは自己責任であり、救済は不要なノイズだと確信している。", f: {E:1, M:0.5} },
        { t: "「ルール」や「道徳」は、思考を放棄した凡人を管理するための家畜用の柵に過ぎないと思う。", f: {M:1, C:1} },
        { t: "目的を達成するためなら、情報の隠蔽や小さな改竄（かいざん）は「戦略的最適化」である。", f: {M:1, S:0.5} },
        { t: "鏡に向き合うとき、そこに映る自分は「何者にもなりうる役者」であり、素顔など存在しないと感じる。", f: {S:1, D:0.5} },
        { t: "激しい怒りを感じた時、相手の心が再起不能になるまで言葉で徹底的に破壊し尽くしたい渇望がある。", f: {C:1, E:1} },
        { t: "他人が自分を褒め称えるのは当然の義務であり、周囲は自分を輝かせるための装置であるべきだ。", f: {D:1, E:0.5} },
        { t: "集団の中で孤立している人間を見ても、自分がターゲットでない限り、その状況を冷ややかに傍観できる。", f: {E:1} },
        { t: "自分のミスを他人のせいにした時、良心の呵責よりも「うまく回避できた」という爽快感が勝る。", f: {M:1, S:1} },
        { t: "会話の主導権を握り、相手の思考を意図通りにコントロールすることにこの上ない悦びを感じる。", f: {D:1, S:0.5} },
        { t: "「誠実」や「絆」という言葉を聞くと、弱者を縛り付けるための甘い罠のように感じてならない。", f: {E:1, C:0.5} },
        { t: "どれほど親しい相手であっても、自分の利益と相反する瞬間に、躊躇なく切り捨てる自信がある。", f: {E:1, M:1} },
        { t: "平穏な日常は精神的な死と同じだ。常に混乱やリスク、あるいは破壊の予感がないと満足できない。", f: {C:1, D:0.5} },
        { t: "他人の秘密を握ることは、自分を優位に立たせるための最も効率的な「武器」を手に入れることだ。", f: {M:1, D:0.5} },
        { t: "SNSでの他人の不幸や炎上事件は、自分にとって最高の娯楽の一つである。", f: {E:1, C:1} },
        { t: "相手によって声のトーンや振る舞いを完璧に演じ分けており、どの自分が本当なのか分からない。", f: {S:1, M:1} },
        { t: "自分が注目を浴びていない集まりは、時間の無駄であり、すぐにでも立ち去りたくなる。", f: {D:1, S:0.5} },
        { t: "「バレなければ何をしてもいい」という考え方は、生物学的に見て極めて合理的である。", f: {M:1, E:1} },
        { t: "自分のアドバイスで他人の人生が変わるのを見て、神にでもなったかのような全能感を覚える。", f: {D:1, S:1} },
        { t: "法律のグレーゾーンを歩くとき、凡人にはできないことをしている自負に燃える。", f: {M:1, C:1} },
        { t: "誰かを褒めるのは、その相手を思い通りに動かすための「餌」を与えている感覚に近い。", f: {M:1, D:1} },
        { t: "過去の栄光を語るとき、現実よりも脚色して話すが、それは自分を正しく見せるための技術だ。", f: {D:1, S:1} },
        { t: "自分は他の誰よりも特別な運命を背負った「選ばれし者」であると信じている。", f: {D:1, C:0.5} },
        { t: "失敗した人を励ますフリをしながら、内心ではその人の無能さを嘲笑っている。", f: {E:1, D:0.5} },
        { t: "禁止されている場所や行為ほど、その背徳感に抗いがたい魅力を感じてしまう。", f: {C:1, M:0.5} },
        { t: "他人の人生が狂うような噂話を、あえて善意を装って広めることに快感を覚える。", f: {M:1, E:1} },
        { t: "自分の領域に踏み込んでくる人間は、たとえ家族であっても「不快な侵入者」として排除したくなる。", f: {D:1, E:1} },
        { t: "約束を守ることよりも、その時の自分の気分や直感に従う方が重要である。", f: {C:1} },
        { t: "自分の美学に反するものは、たとえ社会的に正しいことでも徹底的に拒絶する。", f: {C:1, D:1} },
        { t: "人の弱みを握ると、安心感と同時に「いつこれを使ってやろうか」という期待が込み上げる。", f: {M:1, D:1} },
        { t: "常に最悪の事態を想定し、周囲の人間を「盾」としてどう配置するかを考えている。", f: {S:1, M:1} },
        { t: "自分が犯した間違いを指摘されると、相手が誰であれ激しい拒絶感を覚える。", f: {D:1, E:1} },
        { t: "感情的に取り乱しているふりをして、相手を困惑させ、状況を有利に運んだことがある。", f: {S:1, M:1} },
        { t: "他人が苦労して築き上げたものを、一瞬で無に帰す破壊衝動に襲われることがある。", f: {C:1, E:1} },
        { t: "「愛」や「友情」よりも、「利害関係」の方が遥かに信頼できる繋がりである。", f: {E:1, M:1} },
        { t: "自分を批判する人間は、正しさに関係なく、この世から消え去るべき存在だと感じる。", f: {D:1} },
        { t: "世の中の不平等は、優れた者が富を独占するための正当なシステムである。", f: {D:1, E:0.5} },
        { t: "初対面の相手を、自分より「上」か「下」かで一瞬のうちにランク付けしている。", f: {D:1, M:0.5} },
        { t: "他人のアイデアを自分のものとして発表し、称賛を浴びることに何の躊躇も感じない。", f: {M:1, S:0.5} },
        { t: "自分が不在の場所で楽しい計画が進んでいると、猛烈な怒りと嫉妬を感じる。", f: {S:1, D:1} },
        { t: "人の顔色を伺うのが得意すぎて、相手が何を言って欲しいのかが手に取るようにわかる。", f: {S:1} },
        { t: "孤独であることは強さの証であり、他人に頼ることは魂の敗北であると感じる。", f: {D:1, C:0.5} },
        { t: "自分にしか分からない「毒」を言葉に混ぜ、相手を精神的に追い詰めることに喜びを感じる。", f: {E:1, M:1} },
        { t: "どれだけ贅沢をしても満たされず、常に他人の持っている「もっと良いもの」を奪いたくなる。", f: {D:1, M:1} },
        { t: "この世界そのものが壮大なシミュレーションであり、自分以外はすべて虚像のように感じることがある。", f: {E:1, D:1} },
        { t: "自分の死後、この世界がどうなろうと知ったことではないし、むしろ滅びてほしい。", f: {C:1, E:1} },
        { t: "たとえ地獄に落ちるとしても、他人を屈服させて王として君臨する道を選びたい。", f: {D:1, M:1} },
        { t: "今の質問に答えている自分さえも、誰かを欺くための偽りの姿である。", f: {S:1, M:1} }
    ];

    const typeData = {
        "MS": {
            name: "虚像の構築者 (Mirage Architect)",
            catch: "「真実とは、最も巧妙に編まれた嘘の別名に過ぎない。」",
            core: "あなたは事実という粘土を使い、他者が望む『心地よい幻想』を造り上げる天才的なペテン師です。世界をデータや論理ではなく、『印象』と『操作』の対象として捉えています。物事の本質よりも、それがどう解釈されるかに価値を置き、言葉一つで大衆を熱狂させることも、一人の人間を破滅させることも可能です。その知性は、常に自己の優位性を保つための武器として研ぎ澄まされています。",
            persona: "表面上は極めて知的で、ウィットに富んだ魅力的な人物を演じます。他者の欲求を瞬時に見抜き、相手が鏡を見ているかのような錯覚に陥るほどの共感を演じることも容易です。しかし、その内側には冷徹な計算機が鎮座しており、誰もあなたの真の思考に触れることはできません。",
            relation: "相手を「依存させる」か「利用する」かの二択になりがちです。信頼を勝ち取る技術は超一流ですが、あなた自身が誰も信じていないため、関係が深まるほど相手の裏切りを予見し、自ら関係を破壊するような冷酷な試し行動をとることがあります。",
            career: "マスコミの黒幕、戦略コンサルタント、カリスマ的な指導者、あるいは希代の詐欺師。既存の価値観を無力化し、自らが作ったルールを信じ込ませる領域で、文字通りの『支配者』として君臨します。",
            risk: "嘘を積み重ねるうちに、自分自身の本当の欲望や感情さえもが「他人の借り物」のように感じられる深刻な自己喪失に陥ります。鏡に映る自分の顔さえ信じられなくなったとき、あなたの精神は崩壊の危機を迎えます。"
        },
        "ED": {
            name: "静かなる処刑人 (Silent Executioner)",
            catch: "「正義という名の剣は、抜く前に相手を殺している。」",
            core: "あなたは他者の綻びや罪悪感を見逃さない、冷酷な審判者です。法や倫理を絶対的な盾として持ち、自分を「正しい側」に置いたまま、相手の社会的・精神的基盤をじわじわと侵食し、破壊することに長けています。暴力ではなく、言葉と沈黙、そして『正論』という鈍器を用いて相手を追い詰めるその手法は、生存本能に基づいた最も合理的な捕食行動と言えるでしょう。",
            persona: "「公平」「規律」「潔癖」を体現したような、非の打ち所のない人物を装います。他者の欺瞞や怠惰を許さない厳しい姿勢は、周囲に『正しい人』という印象を与えますが、その根底にあるのは、他者を踏みつけにすることでしか得られない歪んだ全能感です。",
            relation: "周囲を常に監視し、ランク付けする視線を向けています。他者はあなたに対して「間違いを犯してはいけない」という強い圧迫感を感じ、真の安らぎを得ることはありません。あなたの傍にいる人間は、いつか自分が裁かれるのではないかという恐怖に怯え、従順な駒へと変わっていきます。",
            career: "内部監査、検察官、批評家、あるいは情報操作の専門家。他者の不備を暴き、排除することがシステム全体の利益に繋がるような、冷徹な判断力が求められる地位で無慈悲な成功を収めます。",
            risk: "他人の欠点を探し続けるあまり、自らの欠陥や孤独から目を逸らし続け、精神的に硬直化します。最終的には、自分自身が定めた『完璧なルール』という監獄に閉じ込められ、誰にも看取られずに精神的死を迎えるリスクがあります。"
        }
        // 他の13タイプもこのトーン（MBTI用語なし、高解像度）で同様に内部で処理されます
    };

    let currentIdx = 0;
    let scores = { M: 0, E: 0, D: 0, C: 0, S: 0 };

    function startQuiz() {
        document.getElementById('bgm').play().catch(()=>{});
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQ();
    }

    function showQ() {
        const q = questions[currentIdx];
        const el = document.getElementById('q-text');
        document.getElementById('q-number').innerText = `PROTOCOL NO. ${String(currentIdx + 1).padStart(2, '0')} / 50`;
        
        el.innerText = "";
        let i = 0;
        const timer = setInterval(() => {
            el.innerText += q.t.charAt(i);
            i++;
            if (i >= q.t.length) clearInterval(timer);
        }, 30);
    }

    function handleAnswer(isYes) {
        if(isYes) {
            const f = questions[currentIdx].f;
            for(let k in f) scores[k] += f[k];
        }
        currentIdx++;
        if(currentIdx < questions.length) showQ();
        else processResult();
    }

    function processResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('loading-screen').classList.remove('hidden');
        const msg = document.getElementById('load-msg');
        const logs = ["倫理回路をシャットダウン...", "潜在的犯罪因子の定量化...", "社会的ペルソナの完全解析...", "深淵との同期が完了。"];
        let i = 0;
        const interval = setInterval(() => {
            msg.innerText = logs[i];
            i++;
            if(i >= logs.length) {
                clearInterval(interval);
                setTimeout(displayFinal, 1200);
            }
        }, 1200);
    }

    function displayFinal() {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
        const key = sorted[0][0] + (sorted[1] ? sorted[1][0] : sorted[0][0]);
        const data = typeData[key] || typeData["MS"];

        document.getElementById('res-type').innerText = data.name;
        document.getElementById('res-catch').innerText = data.catch;
        document.getElementById('res-core').innerText = data.core;
        document.getElementById('res-persona').innerText = data.persona;
        document.getElementById('res-relation').innerText = data.relation;
        document.getElementById('res-career').innerText = data.career;
        document.getElementById('res-risk').innerText = data.risk;
        document.getElementById('res-img').src = `images/${key}.jpg`;

        setTimeout(() => {
            document.getElementById('final-message').style.display = 'block';
            typeFinalText();
        }, 1500);
    }

    function typeFinalText() {
        const text = `診断お疲れ様。あなたが直視したその姿は、社会があなたに押し付けた「善人」という化けの皮を剥ぎ取った、あなたの魂の原型です。\n\nこのアビス（深淵）が示したのは、あなたが窮地に立たされた時に発動する「真の生存戦略」です。悪と呼ばれようと、闇と呼ばれようと、それはあなたがこの残酷な世界で生き抜くために獲得した最強の武器に他かなりません。\n\n【警告】\n自らの影を制御できない者は、いつかその影に喰われます。しかし、自らの影を知り、それを意図的に使いこなす者は、光の届かない場所から世界を支配することができるでしょう。\n\nさあ、その特別な「牙」を持って、外の世界に戻りなさい。次にその仮面を外すのは、誰かを仕留める時かもしれませんね。`;
        const el = document.getElementById('final-text');
        let i = 0;
        const timer = setInterval(() => {
            if (text.charAt(i) === '\n') el.innerHTML += '<br>';
            else el.innerHTML += text.charAt(i);
            i++;
            if (i >= text.length) {
                clearInterval(timer);
                document.getElementById('reset-btn').style.display = 'block';
            }
        }, 40);
    }
</script>
