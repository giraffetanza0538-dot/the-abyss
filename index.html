<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE ABYSS - 深層心理の深淵</title>
    <style>
        :root {
            --bg-color: #030303;
            --accent-color: #aa0000;
            --text-color: #d0d0d0;
            --card-bg: rgba(10, 10, 10, 0.98);
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', 'Arial', 'Hiragino Sans', 'Meiryo', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 1000;
            background-size: 100% 3px;
            pointer-events: none;
        }

        #app { width: 95%; max-width: 850px; z-index: 10; padding: 10px; box-sizing: border-box; }
        
        .screen { 
            background: var(--card-bg); 
            border: 1px solid #333; 
            padding: 30px; 
            box-shadow: 0 0 80px rgba(170, 0, 0, 0.15); 
            box-sizing: border-box;
            width: 100%;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem !important; letter-spacing: 6px !important; }
            .question-text { font-size: 1.1rem !important; min-height: 120px !important; }
            .btn-container { flex-direction: column; gap: 10px !important; }
            .screen { padding: 20px; }
            .type-title { font-size: 1.8rem !important; }
            .evidence-frame { height: 300px !important; }
        }

        h1 { color: var(--accent-color); text-align: center; letter-spacing: 12px; font-size: 2.5rem; margin-bottom: 30px; text-shadow: 0 0 10px rgba(170, 0, 0, 0.5); }
        
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .q-number { font-size: 0.8rem; color: var(--accent-color); font-weight: bold; letter-spacing: 2px; }
        .question-text { font-size: 1.3rem; line-height: 1.8; min-height: 160px; margin-bottom: 30px; color: #eee; }

        .btn-container { display: flex; gap: 20px; }
        button { 
            flex: 1; background: transparent; color: #888; border: 1px solid #444; 
            padding: 18px; cursor: pointer; font-family: inherit; font-size: 1rem; 
            transition: 0.3s; position: relative; overflow: hidden;
        }
        button:hover { color: var(--accent-color); border-color: var(--accent-color); background: rgba(170,0,0,0.1); }

        .evidence-frame {
            position: relative;
            width: 100%;
            height: 450px;
            background: #000;
            margin-bottom: 10px;
            border: 1px solid #444;
            overflow: hidden;
        }
        .result-img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.8) brightness(0.7) contrast(1.2); }
        
        .corner { position: absolute; width: 20px; height: 20px; border: 2px solid var(--accent-color); z-index: 5; }
        .top-l { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .top-r { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .bot-l { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .bot-r { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        .evidence-info {
            position: absolute; bottom: 20px; left: 45px; color: var(--accent-color);
            font-size: 0.7rem; font-family: monospace; z-index: 5; line-height: 1.4;
            text-shadow: 1px 1px 2px #000;
        }
        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 4rem; color: rgba(170, 0, 0, 0.15); font-weight: bold;
            pointer-events: none; white-space: nowrap; letter-spacing: 10px; z-index: 4;
        }

        /* 出現率バッジと演出メッセージ */
        .ratio-container { text-align: center; margin-bottom: 25px; }
        .ratio-badge { background: var(--accent-color); color: #fff; padding: 2px 12px; font-size: 0.7rem; letter-spacing: 2px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .special-msg { font-size: 0.95rem; color: #fff; font-style: italic; line-height: 1.6; text-shadow: 0 0 5px rgba(255,255,255,0.2); }

        #flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 2000; opacity: 0; pointer-events: none;
        }
        @keyframes shutter {
            0% { opacity: 0; }
            20% { opacity: 1; }
            100% { opacity: 0; }
        }

        .type-title { color: var(--accent-color); font-size: 2.5rem; margin-bottom: 5px; text-align: center; font-weight: bold; }
        .type-subtitle { color: #888; text-align: center; margin-bottom: 30px; font-size: 1rem; letter-spacing: 2px; }
        
        .section-title { color: #fff; font-size: 0.9rem; margin-top: 30px; background: linear-gradient(90deg, var(--accent-color), transparent); padding: 5px 15px; letter-spacing: 2px; font-weight: bold; }
        .section-content { font-size: 1rem; line-height: 1.8; color: #bbb; margin-bottom: 15px; padding: 10px 5px; text-align: justify; }

        #final-message { margin-top: 60px; padding: 30px; border: 1px solid var(--accent-color); background: rgba(20, 0, 0, 0.8); display: none; }
        .hidden { display: none; }
        
        .share-container { margin-top: 30px; text-align: center; }
        .share-url { font-size: 0.8rem; color: #666; word-break: break-all; margin-top: 10px; background: #111; padding: 10px; border: 1px dashed #333; }
    </style>
</head>
<body>

<div id="flash"></div>
<audio id="bgm" loop preload="auto"><source src="bgm.mp3" type="audio/mpeg"></audio>

<div id="app">
    <div id="start-screen" class="screen">
        <h1>THE ABYSS</h1>
        <p style="text-align: center; color: #888; margin-bottom: 40px; line-height: 2; font-size: 0.9rem;">
            [ SYSTEM NOTIFICATION ]<br>
            これよりあなたの脳内領域へアクセスし、50のプロトコルを走らせます。<br>
            社会的バイアスを排除し、直感のみで応答してください。<br>
            あなたの「本性」が暴かれるまで、残り50問。
        </p>
        <button onclick="startQuiz()">システムを起動する</button>
    </div>

    <div id="quiz-screen" class="screen hidden">
        <div class="q-header">
            <div class="q-number" id="q-number"></div>
            <div style="font-size: 0.6rem; color: #666;">STATUS: SCANNING...</div>
        </div>
        <div class="question-text" id="q-text"></div>
        <div class="btn-container">
            <button onclick="handleAnswer(true)">YES (肯定)</button>
            <button onclick="handleAnswer(false)">NO (否定)</button>
        </div>
    </div>

    <div id="loading-screen" class="screen hidden">
        <div id="load-msg" style="text-align: center; color: var(--accent-color); font-size: 1rem; letter-spacing: 3px;"></div>
    </div>

    <div id="result-screen" class="screen hidden">
        <div class="evidence-frame">
            <div class="corner top-l"></div><div class="corner top-r"></div>
            <div class="corner bot-l"></div><div class="corner bot-r"></div>
            <div class="watermark">CONFIDENTIAL</div>
            <div class="evidence-info" id="evidence-meta"></div>
            <img id="res-img" class="result-img" src="" alt="Subject Evidence" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
        </div>

        <!-- 追加：出現比率と特別メッセージ表示領域 -->
        <div class="ratio-container">
            <div id="res-ratio" class="ratio-badge"></div>
            <div id="res-special-msg" class="special-msg"></div>
        </div>

        <div id="res-type" class="type-title"></div>
        <div id="res-catch" class="type-subtitle"></div>
        
        <div class="section-title">■ 深層心理プロファイル</div>
        <div id="res-core" class="section-content"></div>
        
        <div class="section-title">■ 社会的仮面（ペルソナ）と裏の顔</div>
        <div id="res-persona" class="section-content"></div>

        <div class="section-title">■ 人間関係における支配傾向</div>
        <div id="res-relation" class="section-content"></div>

        <div class="section-title">■ 闇の適職と成功への鍵</div>
        <div id="res-career" class="section-content"></div>

        <div class="section-title">■ 破滅のトリガー</div>
        <div id="res-risk" class="section-content"></div>

        <div id="final-message">
            <div style="color: var(--accent-color); font-weight: bold; margin-bottom: 20px; text-align: center; font-size: 1.1rem;">【深淵からの手紙】</div>
            <div id="final-text" style="font-size: 0.9rem; line-height: 2; color: #ccc;"></div>
        </div>

        <div class="share-container">
            <div style="font-size: 0.7rem; color: var(--accent-color); margin-bottom: 5px;">SHARE THIS EVIDENCE</div>
            <div id="share-link" class="share-url"></div>
        </div>

        <button id="reset-btn" onclick="location.href=window.location.pathname" style="width: 100%; margin-top: 40px; display: none; font-size: 0.8rem;">全データを破棄して離脱する</button>
    </div>
</div>

<script>
    const questions = [
        { t: "友人の不幸を聞いた時、表面上は同情するが、内心では「自分は安全だ」という強烈な安堵と優越感を覚える。", f: {E:1, D:0.5} },
        { t: "他人の涙を見ても、共感するよりも先に「この涙は演技か、それとも計算か」と冷ややかに疑ってしまう。", f: {E:1, M:1} },
        { t: "誰かを助ける時、その行為が将来的に自分へどれほどの利益をもたらすかを、無意識に計算している。", f: {M:1, S:0.5} },
        { t: "能力の低い者が苦境に立たされても、それは自己責任であり、救済は社会の進化を妨げる不要なノイズだと確信している。", f: {E:1, D:0.5} },
        { t: "「ルール」や「道徳」は、思考を放棄した凡人を管理するために用意された家畜用の柵に過ぎないと思う。", f: {M:1, C:1} },
        { t: "目的を達成するためなら、情報の隠蔽や小さな改竄（かいざん）は「戦略的最適化」であり、躊躇する必要はない。", f: {M:1, S:0.5} },
        { t: "鏡に向き合うとき、そこに映る自分は「何者にもなりうる役者」であり、真の素顔など存在しないと感じる。", f: {S:1, M:1} },
        { t: "激しい怒りを感じた時、相手の心が再起不能になるまで、言葉の刃で徹底的に破壊し尽くしたいという渇望がある。", f: {C:1, E:1} },
        { t: "他人が自分を褒め称えるのは当然の義務であり、周囲の人間は自分を輝かせるための装置であるべきだ。", f: {D:1, E:0.5} },
        { t: "集団の中で孤立している人間を見ても、自分がターゲットでない限り、その状況を冷めた視線で傍観できる。", f: {E:1} },
        { t: "自分のミスを他人のせいにした時、良心の呵責よりも「うまく難を逃れた」という知的な爽快感の方が大きい。", f: {M:1, S:1} },
        { t: "会話の主導権を握り、相手の思考や反応を自らの意図通りにコントロールすることに、至上の悦びを感じる。", f: {D:1, M:1} },
        { t: "「誠実」や「絆」という言葉を聞くと、それが弱者を繋ぎ止めるための甘い罠のように感じてならない。", f: {E:1, C:0.5} },
        { t: "どれほど親しい相手であっても、自らの利益と相反する瞬間に、躊躇なくその縁を切り捨てる自信がある。", f: {E:1, M:1} },
        { t: "平穏な日常は精神的な死と同じだ。常に何らかの混乱やリスク、あるいは破壊の予感がないと満足できない。", f: {C:1, D:0.5} },
        { t: "他人の秘密を握ることは、自分を優位に立たせるための最も効率的な「弾薬」を手に入れることだ。", f: {M:1, D:0.5} },
        { t: "SNSでの他人の不幸や炎上事件は、自分にとって最高の娯楽の一つである。", f: {E:1, C:1} },
        { t: "相手によって声のトーンや振る舞いを完璧に演じ分けており、どの自分が本物なのか確信が持てない。", f: {S:1, M:1} },
        { t: "自分が注目を浴びていない集まりは時間の無駄であり、すぐにでも立ち去りたくなる。", f: {D:1, S:0.5} },
        { t: "「バレなければ何をしてもいい」という考え方は、生物学的に見て極めて合理的な判断であると思う。", f: {M:1, E:1} },
        { t: "自分のアドバイスで他人の人生が変わるのを見て、神にでもなったかのような全能感を覚えたことがある。", f: {D:1, M:1} },
        { t: "法律のグレーゾーンを歩くとき、捕まらないスリルよりも「凡人にはできない芸当をしている」という自負に燃える。", f: {M:1, C:1} },
        { t: "誰かを褒めるのは、その相手を思い通りに動かすための「餌」を与えている感覚に近い。", f: {M:1, D:1} },
        { t: "過去の話をするとき、自分をより優位に見せるために事実を脚色するが、それは自己演出の一環だ。", f: {D:1, S:1} },
        { t: "自分は他の誰よりも特別な運命を背負った「選ばれし者」であると、心の奥底で信じている。", f: {D:1, C:0.5} },
        { t: "失敗した人を励ますふりをしながら、内心ではその人物の無能さを嘲笑っている。", f: {E:1, D:0.5} },
        { t: "禁止されている場所や行為ほど、その背徳感に抗いがたい魅力を感じて、実行に移してしまう。", f: {C:1, M:0.5} },
        { t: "他人の人生が狂うような噂話を、あえて善意を装って周囲に広めることに快感を覚える。", f: {M:1, E:1} },
        { t: "自分の領域に踏み込んでくる人間は、たとえ家族であっても「不快な侵入者」として排除したくなる。", f: {D:1, E:1} },
        { t: "約束や規律を守ることよりも、その瞬間の自分の気分や直感に従う方が重要である。", f: {C:1, S:0.5} },
        { t: "自分の美学に反するものは、たとえ社会的に正しいとされることでも徹底的に拒絶する。", f: {C:1, D:1} },
        { t: "人の弱みを握ると、安心感と同時に「いつこれを切り札にしようか」という期待が込み上げる。", f: {M:1, D:1} },
        { t: "常に最悪の事態を想定し、周囲の人間を自分を守るための「盾」としてどう配置するかを考えている。", f: {S:1, M:1} },
        { t: "自分が犯した間違いを指摘されると、相手が誰であれ殺意に近い激しい拒絶感を覚える。", f: {D:1, E:1} },
        { t: "感情的に取り乱しているふりをして相手を困惑させ、状況を有利に運んだことがある。", f: {S:1, M:1} },
        { t: "他人が苦労して築き上げたものを、一瞬で無に帰すような破壊衝動に襲われることがある。", f: {C:1, E:1} },
        { t: "「愛」や「友情」よりも、「利害関係」や「貸し借り」の方が遥かに信頼できる繋がりである。", f: {E:1, M:1} },
        { t: "自分を批判する人間は、その正当性に関係なく、この世から消え去るべき存在だと感じる。", f: {D:1} },
        { t: "世の中の不平等は、優れた者が富と権力を独占するための正当なシステムであると思う。", f: {D:1, E:0.5} },
        { t: "初対面の相手を、自分より「強者」か「弱者」かで、一瞬のうちにランク付けしている。", f: {D:1, M:0.5} },
        { t: "他人のアイデアを自らのものとして発表し、称賛を浴びることに何の躊躇も感じない。", f: {M:1, S:0.5} },
        { t: "自分が不在の場所で楽しい計画が進んでいると、猛烈な疎外感と激しい嫉妬を覚える。", f: {S:1, D:1} },
        { t: "人の顔色を伺うのが得意すぎて、相手が今どんな言葉を欲しがっているかが手に取るようにわかる。", f: {S:1} },
        { t: "孤独であることは強さの証であり、他人に頼ることは魂の敗北であると感じる。", f: {D:1, C:0.5} },
        { t: "自分にしか分からない「毒」を言葉に混ぜ、相手を精神的にじわじわと追い詰めることに喜びを感じる。", f: {E:1, M:1} },
        { t: "どれだけ贅沢をしても満たされず、常に他人が持っている「より良いもの」を奪いたくなる。", f: {D:1, M:1} },
        { t: "この世界そのものが壮大なシミュレーションであり、自分以外はすべて虚像のように感じることがある。", f: {E:1, D:1} },
        { t: "自分の死後、この世界がどうなろうと知ったことではない。むしろ、道連れに滅びてほしいとすら思う。", f: {C:1, E:1} },
        { t: "たとえ地獄に落ちるとしても、他人を屈服させて王として君臨する道を選びたい。", f: {D:1, M:1} },
        { t: "今の質問に応えている自分さえも、誰かを欺くための偽りの姿であると感じている。", f: {S:1, M:1} }
    ];

    const typeData = {
        "MS": { name: "情報詐欺師", ratio: "出現率 12.5%", specialMsg: "世界の約8人に1人がこのタイプです。現代社会において最も生存確率の高い、選ばれし知性と言えます。", catch: "「真実とは、最も巧妙に編まれた嘘の別称に過ぎない。」", core: "あなたは事実という粘土を使い、他者が望む『心地よい幻想』を造り上げる天才です。世界をデータではなく『印象』として捉え、言葉一つで大衆を熱狂させる力を持っています。", persona: "知的で魅力的な人物を演じますが、その内面には冷徹な計算機が鎮座しています。他者の欲求を瞬時に見抜き、相手が鏡を見ているかのような錯覚を与える共感を演出します。", relation: "相手を「依存させる」か「利用する」かの二択です。", career: "戦略コンサルタント、カリスマ指導者、黒幕。", risk: "自分自身の本当の欲望さえもが「他人の借り物」のように感じられる深刻な自己喪失。" },
        "ED": { name: "評判の暗殺者", ratio: "出現率 8.5%", specialMsg: "このタイプは人口のわずか8%程度。正義と規律を重んじるがゆえの厳しさは、選ばれたリーダーのみが持つ資質です。", catch: "「正義という名の剣は、抜く前に相手を殺している。」", core: "他者の綻びや罪悪感を見逃さない、冷酷な審判者です。法や倫理を盾として持ち、自分を「正しい側」に置いたまま、相手の社会的基盤を侵食することに長けています。", persona: "「公平」「規律」を体現したような人物を装います。", relation: "周囲を常に監視し、ランク付けしています。", career: "内部監査、検察官、批評家。", risk: "自ら定めた『完璧なルール』という監獄に閉じ込められます。" },
        "MC": { name: "思考の海賊", ratio: "出現率 4.5%", specialMsg: "人口のわずか4.5%しか存在しない稀有な思考形態。常識の枠に収まらないあなたの発想は、時代を動かす異端の輝きを放っています。", catch: "「あなたの記憶も、あなたの思想も、元は私の持ち物だ。」", core: "他者の独創的なアイデアや記憶を盗み取り、自らの血肉とする精神的略奪者です。", persona: "奔放で天才肌な人物に見えますが、その言動はすべて計算されています。", relation: "他者の才能を搾取する関係を築きます。", career: "クリエイティブ・ディレクター、煽動家。", risk: "内面は常に空虚です。真のオリジナリティを突きつけられた時、激しい劣等感で崩壊します。" },
        "SE": { name: "見えない窃盗犯", ratio: "出現率 3.5%", specialMsg: "1000人集まっても35人程度。あなたの持つ観察眼と隠密性は、もはや特殊技能の域に達している『選ばれし観察者』です。", catch: "「失ったことさえ気づかないうちに、すべては私の手の中にある。」", core: "静寂の中に潜み、他者が最も大切にしている感情や機会を奪い去る潜伏型の捕食者です。", persona: "影が薄く、害のない善良な人間を演じます。", relation: "深い関わりを避けつつ、相手の弱みを握ります。", career: "スパイ、情報仲介人、裏社会の会計士。", risk: "誰からも認識されない究極の孤独に陥り、透明な幽霊となって消える恐怖。" },
        "DS": { name: "深淵の独裁者", ratio: "出現率 6.0%", specialMsg: "出現率は6%。多くの人が望んでも手に入らない、強固な意思と支配力を秘めた、数少ない統治者のプロファイルです。", catch: "「自由とは、私に従うという選択肢のことだ。」", core: "目に見えない糸で大衆を操る、影の統治者です。暴力ではなく、恐怖と依存をブレンドした支配体制を築きます。", persona: "威風堂々としたリーダーシップと冷徹な慈悲。抗いがたいカリスマ性を放ちます。", relation: "完全なる縦の関係を求めます。", career: "独裁的な経営者、カルト的政治家、宗教指導者。", risk: "誰も信じられない孤独の中で、自らが築いた帝国の重みに押し潰されます。" },
        "CD": { name: "扇動の放火魔", ratio: "出現率 4.0%", specialMsg: "出現率は約4%。現状を打破する強烈なエネルギーは、平穏を好む凡人たちには理解し難い、革命の火種そのものです。", catch: "「燃え上がる街を眺める時、世界は初めて一つの意思になる。」", core: "平穏な社会に火種を投げ込み、大炎上する様子を特等席で眺める破壊の演出家です。", persona: "熱情的で正義感の強い人物を装い、人々の不満を代弁するヒーローとして現れます。", relation: "友情よりも「共通の敵」に対する憎しみで人々を結束させます。", career: "過激派活動家、ネット炎上の仕掛け人、革命家。", risk: "放った火が自分自身を焼き尽くすリスク。破壊後の虚無感。" },
        "SM": { name: "仮面の偽造師", ratio: "出現率 14.0%", specialMsg: "全人口の14%があなたと同じ資質を持っています。高い社会性を持ち、周囲と摩擦を起こさずに目的を遂げる、極めて理知的なタイプです。", catch: "「本物の私？ それは今、あなたが鏡で見ている顔のことだ。」", core: "相手が望む人格を完璧に演じ分けるアイデンティティの魔術師。あなたの素顔は漆黒の深淵です。", persona: "変幻自在。聖人から実業家まで、相手の期待に合わせて人格を再構成します。", relation: "相手はあなたを「唯一の理解者」と信じ込みますが、あなたはただ模倣しているだけです。", career: "超一流の詐欺師、潜入捜査官、名俳優。", risk: "自分が誰であるかを完全に忘却し、空っぽの器しか残っていないことに気づく精神的死。" },
        "ME": { name: "冷徹な密輸商", ratio: "出現率 7.5%", specialMsg: "全人口の約7.5%に該当。感情に流されないその決断力は、高度に合理化されたプロフェッショナルの証です。", catch: "「禁忌を運ぶのに、感情ほど邪魔な荷物はない。」", core: "道徳的に禁じられた情報を、極めて合理的に取引する闇の商人です。愛や絆も、単なる商品価値に過ぎません。", persona: "礼儀正しく冷静沈着なビジネスマン。しかし瞳には生命への敬意が欠由しています。", relation: "すべてが契約に基づきます。貸し借りを厳密に管理します。", career: "闇サイト運営、武器商人、非合法な情報屋。", risk: "合理性を突き詰めた結果、生きる意味さえも見失うリスク。" },
        "DE": { name: "共鳴のカルト教祖", ratio: "出現率 7.0%", specialMsg: "100人中7人しかいない、希少なカリスマ性の持ち主です。人を惹きつける力は、天賦の才能と言っても過言ではありません。", catch: "「救いとは、私という深淵にすべてを投げ出すことだ。」", core: "孤独な魂の隙間に滑り込み、支配という名の救済を与える精神的簒奪者です。", persona: "圧倒的な包容力と神聖なオーラ。弱者を惹きつける慈愛の仮面を被っています。", relation: "信者と教祖。相手の自己肯定感を破壊した後に全肯定を与え、服従を強います。", career: "スピリチュアル指導者、ブラック企業の経営者。", risk: "崇拝者がいなくなれば空虚な自分。自ら作った教義に縛り殺されます。" },
        "CE": { name: "背徳のギャンブラー", ratio: "出現率 3.0%", specialMsg: "世界のわずか3%しか持ち得ない純粋なリスク志向。破滅を恐れぬその勇姿は、多くの人の目を釘付けにするでしょう。", catch: "「破滅の直前、人は最も美しく輝く。」", core: "自分と他人の人生をチップにして、最も危険な賭けに興じるスリル中毒者です。", persona: "退廃的で刹那的な快楽主義者。", relation: "相手を道連れにする破滅的な関係。壊されることで愛を感じる歪んだ愛憎劇。", career: "ハイリスクな投資家、危険地帯ジャーナリスト、破滅型アーティスト。", risk: "すべてを失い、誰からも顧みられない路地裏での野垂れ死に。" },
        "SD": { name: "多重スパイ", ratio: "出現率 11.5%", specialMsg: "約10人に1人がこの結果に辿り着きます。組織の中で中核を担う人々に多く見られる、バランスの取れた戦略家の証です。", catch: "「誰の味方でもない。私が味方するのは、常に『勝利』だけだ。」", core: "複数の顔を持ち、対立する勢力の合間を泳ぎ回りながら、双方をコントロールする均衡の支配者です。", persona: "有能な部下、あるいは信頼できる友人。しかし情報は毒が混ぜられた誘導灯です。", relation: "常に裏切りの準備を整えています。", career: "情報機関、Ｍ＆Ａ仲介、政界のフィクサー。", risk: "恒久的な帰属意識の欠如。自分が何を信じているか分からなくなり精神が四散する恐れ。" },
        "CS": { name: "異端のリバタリアン", ratio: "出現率 0.7%", specialMsg: "あなたは約1万人に7人の『超希少種』です。完全なる自由を追求するその魂は、現代社会では制御不能な究極の個人主義者です。", catch: "「自由を阻むものは、神であれ王であれ焼き払う。」", core: "あらゆる既存の秩序、伝統、道徳を憎悪する無政府主義者です。", persona: "物静かで冷淡な個人主義者。しかし内側には傲慢な自律心が渦巻いています。", relation: "他者との絆を「脆弱さ」として拒絶します。", career: "ハッカー、異端の哲学者、孤独なテロリスト。", risk: "完全な自由の果てにある、絶対的な虚無。" },
        "ES": { name: "沈黙の処刑人", ratio: "出現率 0.9%", specialMsg: "約1万人に9人の逸材。感情を排した氷のような決断力は、人間を超越したシステムに近い特異な存在であることを示しています。", catch: "「言葉による弁明は不要だ。結果がすべてを裁く。」", core: "感情を完全に排し、事務的な態度で他人の人生や地位を終わらせることができる執行者です。", persona: "感情の起伏が見えない鋼の仮面。死神に近い静謐なプレッシャーを与えます。", relation: "人間味を排除した、機能的な繋がりしか持ちません。", career: "整理解雇担当、過酷な刑罰の執行官。", risk: "人間としての心が石化し、自分が生きているのか死んでいるのか判別できない生ける屍。" },
        "DM": { name: "強欲な徴収官", ratio: "出現率 3.5%", specialMsg: "3.5%の希少なプロファイル。成功への渇望が人一倍強いあなたは、富を独占する資格を持つ数少ない実力者の一人です。", catch: "「あなたの価値は、私がどれだけ搾り取れるかで決まる。」", core: "他人の労力や魂を、効率的に収集・蓄積することに執着する強欲な略奪者です。", persona: "面倒見の良いパトロン。しかし正体は、利子をつけてすべてを奪い取る吸血鬼です。", relation: "相手を債務者のように扱い、精神的に奴隷化することを楽しみます。", career: "冷酷な高利貸し、搾取型プラットフォーム創設、遺産略奪者。", risk: "底なしの飢餓感。最終的には自分の身体さえも金に変えようとし、自滅します。" },
        "EC": { name: "虚無の破壊者", ratio: "出現率 0.5%", specialMsg: "あなたは、2万人に1人の逸材です。深淵の底まで到達したその虚無感と破壊的衝動は、もはや一つの芸術的な特異点です。", catch: "「美しいものは、粉々に砕ける時に最も完成される。」", core: "形あるものを無意味という名の深淵へ叩き落とす純粋な破壊者です。そこに憎しみはありません。", persona: "どこか虚ろで、現世に興味がない雰囲気。しかし手は常に破壊のチャンスを狙っています。", relation: "他者が大切にしているものを踏みにじり、絶望する反応を観察します。", career: "市場破壊者、解体屋、破壊芸術家。", risk: "最後には自分自身を破壊する以外に道がなくなる究極のニヒリズム。" }
    };

    let currentIdx = 0;
    let scores = { M: 0, E: 0, D: 0, C: 0, S: 0 };

    function startQuiz() {
        document.getElementById('bgm').play().catch(()=>{});
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQ();
    }

    function showQ() {
        const q = questions[currentIdx];
        const el = document.getElementById('q-text');
        document.getElementById('q-number').innerText = `PROTOCOL NO. ${String(currentIdx + 1).padStart(2, '0')} / 50`;
        
        el.innerText = "";
        let i = 0;
        const timer = setInterval(() => {
            el.innerText += q.t.charAt(i);
            i++;
            if (i >= q.t.length) clearInterval(timer);
        }, 30);
    }

    function handleAnswer(isYes) {
        if(isYes) {
            const f = questions[currentIdx].f;
            for(let k in f) scores[k] += f[k];
        }
        currentIdx++;
        if(currentIdx < questions.length) showQ();
        else processResult();
    }

    function processResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('loading-screen').classList.remove('hidden');
        const msg = document.getElementById('load-msg');
        const logs = ["倫理回路をシャットダウン中...", "潜在理性をスキャン中...", "社会的ペルソナを剥離中...", "深淵との同期が完了しました。"];
        let i = 0;
        const interval = setInterval(() => {
            msg.innerText = logs[i];
            i++;
            if(i >= logs.length) {
                clearInterval(interval);
                setTimeout(displayFinal, 1000);
            }
        }, 1200);
    }

    function displayFinal() {
        const flash = document.getElementById('flash');
        flash.style.animation = 'shutter 0.4s ease-out';
        
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
        const key = sorted[0][0] + (sorted[1] ? sorted[1][0] : sorted[0][0]);
        const data = typeData[key] || typeData["MS"];

        const date = new Date();
        const timestamp = `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${date.getMinutes()}:${date.getSeconds()}`;
        const uniqueID = 'ABYSS-' + Math.random().toString(36).substr(2, 7).toUpperCase();
        document.getElementById('evidence-meta').innerHTML = `SCAN_TIME: ${timestamp}<br>SUBJECT_ID: ${uniqueID}<br>STATUS: VERIFIED`;

        const shareUrl = `${window.location.origin}${window.location.pathname}?type=${key}`;
        document.getElementById('share-link').innerText = shareUrl;
        window.history.pushState({path:shareUrl},'',shareUrl);

        // 各種データの反映
        document.getElementById('res-type').innerText = data.name;
        document.getElementById('res-catch').innerText = data.catch;
        document.getElementById('res-ratio').innerText = data.ratio;
        document.getElementById('res-special-msg').innerText = data.specialMsg;
        document.getElementById('res-core').innerText = data.core;
        document.getElementById('res-persona').innerText = data.persona;
        document.getElementById('res-relation').innerText = data.relation;
        document.getElementById('res-career').innerText = data.career;
        document.getElementById('res-risk').innerText = data.risk;
        
        document.getElementById('res-img').src = `images/${key}.jpg`;

        setTimeout(() => {
            document.getElementById('final-message').style.display = 'block';
            typeFinalText();
        }, 1500);
    }

    function typeFinalText() {
        const text = `診断お疲れ様でした。あなたが直視したその姿は、社会があなたに押し付けた「善人」という化けの皮を剥ぎ取った、魂の原型です。\n\nこのアビス（深淵）が示したのは、あなたが窮地に立たされた時に発動する「真の生存戦略」に他なりません。悪と呼ばれようと、闇と呼ばれようと、それはあなたがこの残酷な世界を生き抜くために獲得した最強の武器なのです。\n\nさあ、その特別な「牙」を持って、外の世界に戻りなさい。`;
        const el = document.getElementById('final-text');
        let i = 0;
        const timer = setInterval(() => {
            if (text.charAt(i) === '\n') el.innerHTML += '<br>';
            else el.innerHTML += text.charAt(i);
            i++;
            if (i >= text.length) {
                clearInterval(timer);
                document.getElementById('reset-btn').style.display = 'block';
            }
        }, 40);
    }
</script>
