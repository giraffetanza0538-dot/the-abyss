<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE ABYSS - 深層心理極秘診断レポート</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #aa0000;
            --text-color: #d0d0d0;
            --card-bg: rgba(10, 10, 10, 0.98);
            --border-color: #333;
            --glitch-speed: 0.2s;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', 'Helvetica Neue', 'Arial', 'Hiragino Sans', 'Meiryo', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 走査線・ノイズオーバーレイ */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            z-index: 5000;
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.6;
        }

        #app { width: 95%; max-width: 800px; z-index: 10; padding: 40px 0; }
        
        .screen { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            padding: 40px; 
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9); 
            position: relative;
            box-sizing: border-box;
            transition: opacity 0.5s ease;
        }

        /* グリッチアニメーション */
        @keyframes glitch {
            0% { transform: translate(0); text-shadow: -2px 0 red, 2px 0 blue; }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        h1 { 
            color: var(--accent-color); 
            text-align: center; 
            letter-spacing: 15px; 
            font-size: 2.5rem; 
            margin-bottom: 10px; 
            text-shadow: 0 0 15px rgba(170, 0, 0, 0.6);
            animation: glitch 5s infinite;
        }
        
        /* プログレスバー */
        .progress-container {
            width: 100%;
            height: 2px;
            background: #111;
            margin-bottom: 30px;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* 質問画面の要素 */
        .q-header { display: flex; justify-content: space-between; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .q-number { font-size: 0.8rem; color: var(--accent-color); letter-spacing: 2px; }
        .question-text { font-size: 1.2rem; line-height: 2; min-height: 140px; margin-bottom: 40px; color: #eee; }

        .btn-container { display: flex; gap: 20px; }
        button { 
            flex: 1; background: transparent; color: #aaa; border: 1px solid #444; 
            padding: 20px; cursor: pointer; font-family: inherit; font-size: 1rem; 
            transition: 0.2s; letter-spacing: 3px;
            position: relative;
            overflow: hidden;
        }
        button:hover { color: #fff; border-color: var(--accent-color); background: rgba(170,0,0,0.15); box-shadow: 0 0 15px rgba(170,0,0,0.2); }
        button:active { transform: scale(0.98); }

        /* 外側に配置するリロードボタン */
        .reload-outer-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }
        .reload-btn {
            background: transparent;
            color: #555;
            border: 1px solid #222;
            padding: 10px 20px;
            font-size: 0.7rem;
            letter-spacing: 3px;
            cursor: pointer;
            width: auto;
            flex: none;
        }
        .reload-btn:hover { color: var(--accent-color); border-color: var(--accent-color); }

        /* 結果画面のデザイン */
        .destroy-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--accent-color);
            letter-spacing: 4px;
            margin-bottom: 30px;
            border-top: 1px solid var(--accent-color);
            border-bottom: 1px solid var(--accent-color);
            padding: 12px 0;
            font-weight: bold;
            background: rgba(170, 0, 0, 0.05);
        }

        .evidence-frame {
            position: relative;
            width: 100%;
            height: 400px;
            background: #000;
            margin-bottom: 30px;
            border: 1px solid #444;
            overflow: hidden;
        }
        .scan-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: rgba(255, 0, 0, 0.7);
            box-shadow: 0 0 15px red;
            animation: scanning 4s linear infinite;
            z-index: 5;
        }
        @keyframes scanning { 0% { top: 0%; } 100% { top: 100%; } }

        .result-img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.3) brightness(0.8); opacity: 0.6; transition: 1s; }
        .type-title { font-size: 2.8rem; color: var(--accent-color); text-align: center; margin: 0; font-weight: bold; letter-spacing: 10px; text-shadow: 0 0 20px rgba(170,0,0,0.4); }
        .type-subtitle { text-align: center; color: #888; font-size: 1rem; margin-bottom: 40px; letter-spacing: 2px; font-style: italic; }

        .section-title { 
            border-left: 4px solid var(--accent-color); 
            padding-left: 15px; margin-top: 35px; margin-bottom: 15px;
            font-weight: bold; font-size: 1rem; color: #fff; letter-spacing: 2px;
        }
        .section-content { font-size: 0.95rem; line-height: 1.8; color: #bbb; text-align: justify; margin-bottom: 20px; }

        /* シェアボタン */
        .share-container {
            display: flex;
            gap: 15px;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #333;
        }
        .share-btn { font-size: 0.8rem; padding: 12px; }
        .btn-x { border-color: #555; color: #fff; }
        .btn-copy { border-color: #555; color: #fff; }

        /* 警告ボックス */
        .warning-box {
            border: 1px dashed var(--accent-color);
            padding: 20px;
            margin: 30px 0;
            background: rgba(170, 0, 0, 0.05);
        }
        .warning-text { color: #eee; font-size: 0.85rem; font-style: italic; line-height: 1.6; }

        .hidden { display: none !important; }
        
        #loading-msg { text-align: center; color: var(--accent-color); letter-spacing: 5px; margin-top: 25px; font-weight: bold; }

        @media (max-width: 600px) {
            .screen { padding: 25px; }
            .type-title { font-size: 1.8rem; letter-spacing: 5px; }
            .btn-container { flex-direction: column; }
        }
    </style>
</head>
<body>

<audio id="bgm" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg">
</audio>

<div id="app">
    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
        <div style="text-align: center; font-size: 0.7rem; color: #555; margin-bottom: 20px; letter-spacing: 4px;">PROJECT ID: ABYSS-2026</div>
        <h1>THE ABYSS</h1>
        <p style="text-align: center; color: #888; margin-bottom: 40px; line-height: 2; font-size: 0.9rem;">
            この診断は、あなたの社会的仮面の裏に潜む<br>
            「真の属性」を暴き出すためのプロトコルです。<br>
            50の問いに対し、偽りなく応答してください。
        </p>
        <button onclick="startQuiz()" style="width: 100%; border-color: var(--accent-color); color: #fff;">システムを起動する</button>
    </div>

    <!-- 質問画面 -->
    <div id="quiz-screen" class="screen hidden">
        <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
        <div class="q-header">
            <div class="q-number" id="q-number">PROTOCOL NO. 01</div>
            <div style="font-size: 0.6rem; color: #555;">ENCRYPTED SESSION</div>
        </div>
        <div class="question-text" id="q-text"></div>
        <div class="btn-container">
            <button onclick="handleAnswer(true)">YES</button>
            <button onclick="handleAnswer(false)">NO</button>
        </div>
    </div>

    <!-- 質問中のみ表示される外側のリロードボタン -->
    <div id="reload-container" class="reload-outer-container hidden">
        <button class="reload-btn" onclick="typeWriter()">[ RELOAD TEXT ]</button>
    </div>

    <!-- ローディング画面 -->
    <div id="loading-screen" class="screen hidden">
        <div style="height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div style="width: 50px; height: 50px; border: 2px solid #222; border-top-color: var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <div id="loading-msg">ANALYZING PSYCHE...</div>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen hidden">
        <div class="destroy-note">CONFIDENTIAL: 閲覧後は本ページを破棄してください</div>
        
        <div class="evidence-frame">
            <div class="scan-line"></div>
            <img id="res-img" class="result-img" src="" alt="Evidence">
        </div>

        <div id="res-type" class="type-title"></div>
        <div id="res-catch" class="type-subtitle"></div>

        <div class="section-title">■ 深層心理の核心 (CORE)</div>
        <div id="res-core" class="section-content"></div>

        <div class="section-title">■ 社会的仮面 (PERSONA)</div>
        <div id="res-persona" class="section-content"></div>

        <div class="section-title">■ 対人関係の流儀 (RELATION)</div>
        <div id="res-relation" class="section-content"></div>

        <div class="section-title">■ 破滅へのトリガー (RISK)</div>
        <div id="res-risk" class="section-content"></div>

        <div class="warning-box">
            <div id="abyss-warning" class="warning-text"></div>
        </div>

        <div class="share-container">
            <button class="share-btn btn-x" onclick="shareX()">Xで報告</button>
            <button class="share-btn btn-copy" onclick="copyLink()">URLをコピー</button>
        </div>

        <button onclick="location.reload()" style="width: 100%; margin-top: 30px; font-size: 0.8rem; border-color: #222;">記録を抹消して終了</button>
    </div>
</div>

<script>
    // 診断データ
    const typeData = {
        "MS": { name: "情報詐欺師", ratio: "12.5%", catch: "「真実とは、最も巧妙に編まれた嘘の別称に過ぎない。」", core: "事実という無機質な粘土を使い、他者が欲しがる『心地よい幻想』を造り上げる天才です。", persona: "非常に知的で洗練された相談役を演じますが、その裏では常に損得の計算機が動いています。", relation: "相手を「依存させる駒」か「利用対象」として見ており、深い愛着は脆弱性とみなします。", risk: "嘘を重ねすぎた結果、自分自身の本当の欲望さえ借り物のように感じる自己喪失のリスクがあります。", img: "https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=800" },
        "ED": { name: "評判の暗殺者", ratio: "8.5%", catch: "「正義という名の剣は、抜く前に相手を殺している。」", core: "他者の綻びを見逃さない冷酷な審判者。正論という武器で社会的な死を与えることに長けています。", persona: "公平無私なリーダーを装いつつ、獲物の弱点スキャンダルを収集するハンターの顔を持ちます。", relation: "周囲を常に監視しランク付けしています。一度敵と見なせば慈悲なく外堀から埋めて排除します。", risk: "自ら定めた完璧なルールという名の監獄に囚われ、最終的に誰からも受け入れられず孤立します。", img: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=800" },
        "MC": { name: "思考の海賊", ratio: "4.5%", catch: "「あなたの記憶も、あなたの思想も、元は私の持ち物だ。」", core: "他者の独創的なアイデアを吸収し、自らの血肉とする精神的略奪者。再構築の天才です。", persona: "エキセントリックな天才を装い、借り物の言葉を魂の叫びのように劇的に演出します。", relation: "才能を搾取する関係を築き、利用価値がなくなれば即座に視線を向けるのをやめます。", risk: "内面は常に空虚であり、真の独創性を突きつけられた際に自己が崩壊する恐怖を抱えています。", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800" },
        "SE": { name: "見えない窃盗犯", ratio: "3.5%", catch: "「失ったことさえ気づかないうちに、すべては私の手の中にある。」", core: "静寂に潜み、他人の機会や寵愛を気づかれぬうちに奪い去る潜伏型の捕食者です。", persona: "目立たず害のない人間を完璧に演じ、警戒されずに重要機密や弱点を吸収し続けます。", relation: "全員の弱みを握りつつ深く関わらず、自分自身の心を見せることは万に一つもありません。", risk: "誰からも認識されない究極の孤独に陥り、自分が存在するか確信が持てなくなる恐怖があります。", img: "https://images.unsplash.com/photo-1525930372433-2898c603a11b?q=80&w=800" },
        "DS": { name: "深淵の独裁者", ratio: "6.0%", catch: "「自由とは、私に従うという選択肢のことだ。」", core: "心理的な糸で大衆を操る影の統治者。恐怖と依存を混ぜた支配体制を好みます。", persona: "圧倒的な威風を放つ救世主として振る舞い、他者の自己決定権を奪い手足にします。", relation: "完全なる主従関係を求めます。対等な関係は反逆の予兆であり、不確実なリスクです。", risk: "誰も心から信じられない疑心暗鬼の中で、自ら築いた帝国の重みに押し潰されるリスクがあります。", img: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?q=80&w=800" },
        "CD": { name: "扇動の放火魔", ratio: "4.0%", catch: "「燃え上がる街を眺める時、世界は初めて一つの意思になる。」", core: "平穏に耐えられず、物議を醸す火種を投げ込んでカオスを眺める破壊の演出家です。", persona: "情熱的な革命家を装いますが、その実態は破壊衝動そのもの。対立を煽ることに快感を覚えます。", relation: "人間関係を使い捨ての燃料と考え、最後は自分だけが生き残るよう冷徹に仕向けます。", risk: "自ら放った火がコントロールを失い、逃げ場のない場所で自分自身を焼き尽くすリスクがあります。", img: "https://images.unsplash.com/photo-1533604135967-05a5df7bcc55?q=80&w=800" },
        "SM": { name: "仮面の偽造師", ratio: "14.0%", catch: "「本物の私？ それは今、あなたが鏡で見ている顔のことだ。」", core: "相手が見たい人格を反射して演じ分ける魔術師。素顔という概念を持ち合わせていません。", persona: "ターゲットの好みに合わせて人格を数秒で再構成します。その演技に綻びはありません。", relation: "相手に唯一の理解者だと錯覚させますが、実際は期待値を模倣しているに過ぎません。", risk: "自分が誰であるかを完全に忘却し、人生の終盤に空っぽの器しか残らない虚無が待っています。", img: "https://images.unsplash.com/photo-1502444330042-d1a1ddf9bb5b?q=80&w=800" },
        "ME": { name: "冷徹な密輸商", ratio: "7.5%", catch: "「禁忌を運ぶのに、感情ほど邪魔な荷物はない。」", core: "法律や道徳に禁じられたものを数値化された商品として扱う。利回りがすべてです。", persona: "几帳面なビジネスマンですが、瞳には生命や愛に対する敬意が決定的に欠如しています。", relation: "すべての関係は契約に基づきドライ。親友であっても支払いが滞れば即座に差し押さえます。", risk: "合理性を極めた結果、人間としての情緒が枯渇し、データの一部として消滅するリスクがあります。", img: "https://images.unsplash.com/photo-1451187530220-4c2a42d99d1e?q=80&w=800" },

        "CE": { name: "背徳のギャンブラー", ratio: "3.0%", catch: "「破滅の直前、人は最も美しく輝く。」", core: "自命や周囲の平穏をチップにして死と隣り合わせの賭けに興じるスリル中毒者です。", persona: "刹那的な快楽主義者の雰囲気を纏い、奈落の縁を歩く危うさで周囲を惹きつけます。", relation: "相手を道連れにして共倒れになるような破滅的な関係を繰り返すことで愛を実感します。", risk: "最後は何もかも失い、誰からも顧みられない路地裏での野垂れ死にへの親和性が高いです。", img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=800" },
        "SD": { name: "多重スパイ", ratio: "11.5%", catch: "「誰の味方ではない。私が味方するのは、常に『勝利』だけだ。」", core: "二つの勢力の間で双方をコントロールし、自分に最も有利な着地点を探り当てる均衡の支配者。", persona: "有能で忠実な部下として振る舞いつつ、相手を誘導するための毒の餌を撒き続けます。", relation: "常に裏切りの準備をしています。利害が一致しなくなれば、昨日までの盟友も即座に売ります。", risk: "どこにも所属できない恒久的な帰属意識の欠如、一生誰とも心を通わせられないリスクがあります。", img: "https://images.unsplash.com/photo-1454165833767-027eeef15265?q=80&w=800" },
        "CS": { name: "異端のリバタリアン", ratio: "0.7%", catch: "「自由を阻むものは、神であれ王であれ焼き払う。」", core: "既存の秩序や社会システムを束縛として憎悪する、究極の個人主義者です。", persona: "知的な個人主義者ですが、内側では他者を見下し、社会慣習をゴミのように扱っています。", relation: "対人関係を脆弱さの始まりとして拒絶。必要な時だけ接続し、終われば鮮やかに切断します。", risk: "完全に自由になった果てに、何の意味も持たない絶対的な虚無に到達し、生きる目的を失います。", img: "https://images.unsplash.com/photo-1514539079130-25950c84af65?q=80&w=800" },

        bgm.muted = false;

    function startQuiz() {
        startAudio();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

        showQ();
    }

    function showQ() {
        const q = questions[currentIdx];
        document.getElementById('q-number').innerText = `PROTOCOL NO. ${String(currentIdx + 1).padStart(2, '0')}`;
        // プログレスバー更新
        const progress = (currentIdx / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;
        typeWriter();
    }

    function typeWriter() {
        if(typing) return;
        typing = true;
        const qText = questions[currentIdx].t;
        const el = document.getElementById('q-text');
        el.innerText = "";
        let i = 0;
        const interval = setInterval(() => {
            el.innerText += qText.charAt(i);
            i++;
            if(i >= qText.length) {
                clearInterval(interval);
                typing = false;
            }
        }, 25);
    }

    function handleAnswer(isYes) {
        if(typing) return;
        const q = questions[currentIdx];
        const effects = isYes ? q.fy : q.fn;
        if(effects) {
            for(let k in effects) scores[k] += effects[k];
        }
        
        currentIdx++;
        if(currentIdx < questions.length) {
            showQ();
        } else {
            document.getElementById('progress-bar').style.width = `100%`;
            processResult();
        }
    }

    function processResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('reload-container').classList.add('hidden');
        document.getElementById('loading-screen').classList.remove('hidden');
        
        let i = 0;
        const msgs = ["意識層をスキャン中...", "情報の断片を統合中...", "社会的仮面を剥離中...", "深層心理プロファイル作成中..."];
        const loadInterval = setInterval(() => {
            document.getElementById('loading-msg').innerText = msgs[i];
            i++;
            if(i >= msgs.length) {
                clearInterval(loadInterval);
                showFinal();
            }
        }, 800);
    }

    // デコード演出関数
    function decodeText(elementId, finalStr) {
        const el = document.getElementById(elementId);
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789あいうえおかきくけこ";
        let iterations = 0;
        const interval = setInterval(() => {
            el.innerText = finalStr.split("").map((char, index) => {
                if(index < iterations) return char;
                return chars[Math.floor(Math.random() * chars.length)];
            }).join("");
            if(iterations >= finalStr.length) clearInterval(interval);
            iterations += 1/3;
        }, 30);
    }

    function showFinal() {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        // スコア集計ロジック修正: 偏りを防ぐためのキー検索
        const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
        const p = sorted[0][0]; // 1位のカテゴリ
        const s = sorted[1][0]; // 2位のカテゴリ
        
        let key = p + s;
        // キーが存在しない場合、入れ替えて再試行（これで全タイプを網羅）
        if (!typeData[key]) {
            key = s + p;
        }
        // それでも見つからない場合のフォールバック
        const res = typeData[key] || typeData["MS"];

        document.getElementById('res-img').src = res.img;
        document.getElementById('res-img').style.filter = "grayscale(1) contrast(1.3)";
        
        // デコード演出を適用
        decodeText('res-type', res.name);
        
        document.getElementById('res-catch').innerText = res.catch;
        document.getElementById('res-core').innerText = res.core;
        document.getElementById('res-persona').innerText = res.persona;
        document.getElementById('res-relation').innerText = res.relation;
        document.getElementById('res-risk').innerText = res.risk;

        document.getElementById('abyss-warning').innerText = abyssWarnings[Math.floor(Math.random() * abyssWarnings.length)];
    }
