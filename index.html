<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ABYSS - 深層心理の深淵</title>
    <style>
        :root {
            --bg-color: #030303;
            --accent-color: #aa0000;
            --text-color: #d0d0d0;
            --card-bg: rgba(10, 10, 10, 0.98);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Hiragino Mincho ProN', 'MS PMincho', serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* 走査線エフェクト */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 1000;
            background-size: 100% 3px;
            pointer-events: none;
        }
        #app { width: 90%; max-width: 800px; z-index: 10; padding: 20px; }
        .screen { background: var(--card-bg); border: 1px solid #333; padding: 40px; box-shadow: 0 0 80px rgba(170, 0, 0, 0.15); position: relative; }
        h1 { color: var(--accent-color); text-align: center; letter-spacing: 12px; font-size: 2.5rem; margin-bottom: 40px; text-shadow: 0 0 10px rgba(170, 0, 0, 0.5); }
        .question-text { font-size: 1.25rem; line-height: 2.2; min-height: 160px; margin-bottom: 40px; color: #eee; }
        .btn-container { display: flex; gap: 20px; }
        button { flex: 1; background: transparent; color: #888; border: 1px solid #444; padding: 20px; cursor: pointer; font-family: inherit; font-size: 1.1rem; transition: 0.4s; }
        button:hover { color: var(--accent-color); border-color: var(--accent-color); background: rgba(170,0,0,0.1); }
        .glitch-active { animation: glitch 0.2s linear; }
        @keyframes glitch { 0% { transform: translate(2px, -2px); } 50% { transform: translate(-2px, 2px); filter: hue-rotate(90deg); } 100% { transform: translate(0); } }
        .result-img { width: 100%; height: 400px; background: #000; margin-bottom: 30px; border: 1px solid #444; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .result-img img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(0.7) contrast(1.3); transition: 1s; }
        .type-title { color: var(--accent-color); font-size: 2.4rem; margin-bottom: 10px; text-align: center; font-weight: bold; letter-spacing: 4px; }
        .type-subtitle { color: #666; text-align: center; margin-bottom: 30px; font-size: 0.9rem; }
        .section-title { color: var(--accent-color); font-size: 0.85rem; margin-top: 35px; border-left: 3px solid var(--accent-color); padding-left: 15px; letter-spacing: 2px; }
        .section-content { font-size: 1.05rem; line-height: 2; color: #ccc; margin-bottom: 20px; padding-top: 10px; text-align: justify; }
        #final-message { margin-top: 80px; padding: 50px; border: 1px double var(--accent-color); background: rgba(15, 0, 0, 0.9); display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<audio id="bgm" loop preload="auto"><source src="bgm.mp3" type="audio/mpeg"></audio>

<div id="app">
    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
        <h1>THE ABYSS</h1>
        <p style="text-align: center; color: #777; margin-bottom: 40px; line-height: 2;">
            このスキャンは、あなたの「社会的仮面」を剥ぎ取ります。<br>
            倫理や道徳を一度忘れ、深淵からの問いに応えてください。<br>
            完了後、あなたはもう以前の自分には戻れないかもしれません。
        </p>
        <button onclick="startQuiz()">接続を開始する</button>
    </div>

    <!-- 質問画面 -->
    <div id="quiz-screen" class="screen hidden">
        <div id="q-number" style="font-size: 0.7rem; color: #555; margin-bottom: 15px; letter-spacing: 2px;"></div>
        <div class="question-text" id="q-text"></div>
        <div class="btn-container">
            <button onclick="handleAnswer(true)">肯 定</button>
            <button onclick="handleAnswer(false)">否 定</button>
        </div>
    </div>

    <!-- 待機画面 -->
    <div id="loading-screen" class="screen hidden">
        <div id="load-msg" style="text-align: center; color: var(--accent-color); font-size: 1.2rem; letter-spacing: 5px;"></div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen hidden">
        <div class="result-img"><img id="res-img" src="" alt=""></div>
        <div id="res-type" class="type-title"></div>
        <div id="res-catch" class="type-subtitle"></div>
        
        <div class="section-title">【深層心理の構造】</div>
        <div id="res-core" class="section-content"></div>
        
        <div class="section-title">【特筆すべき資質】</div>
        <div id="res-strength" class="section-content"></div>

        <div class="section-title">【内包する破滅的リスク】</div>
        <div id="res-risk" class="section-content"></div>

        <div id="final-message">
            <div style="color: var(--accent-color); font-weight: bold; margin-bottom: 25px; text-align: center;">深淵からの手紙：あなたの影への総評</div>
            <div id="final-text" style="font-size: 0.95rem; line-height: 2.2; color: #bbb;"></div>
        </div>

        <button id="reset-btn" onclick="location.reload()" style="width: 100%; margin-top: 60px; display: none; color: #555;">全記録を抹消し離脱する</button>
    </div>
</div>

<script>
    const questions = [
        { t: "友人が不運に見舞われた際、表面上の同情とは裏腹に、心の奥底で「自分が当事者でなくて本当に良かった」と蜜の味を感じる。", f: {E:1, M:0.5} },
        { t: "目の前で激しく泣き叫ぶ人間を見ても、その感情には一切共鳴せず、ただ観察対象としてその「泣く理由」を解剖したくなる。", f: {E:1, M:0.5} },
        { t: "他人に手を差し伸べる行為は、将来的に自分へ有利に働くための「先行投資」であると無意識に計算している。", f: {M:1, S:0.5} },
        { t: "自分より能力の低い者が損害を被るのは、社会における適者生存の結果であり、救済の手を出すのは無意味な感傷だ。", f: {E:1, M:0.5} },
        { t: "親友であっても、自分の成功を心の底から祝福しているはずがない。人間とは常に他者の幸福を妬む生き物だからだ。", f: {E:0.5, S:1} },
        { t: "「誠実」や「絆」という言葉を聞くと、それが弱者を繋ぎ止めるための甘い嘘のように聞こえてならない。", f: {E:1, C:0.5} },
        { t: "嘘をつくことに罪悪感はない。むしろ、望む結果を得るために「真実を最適化している」という感覚に近い。", f: {M:1, S:1} },
        { t: "他人が自分を称賛するのは当然の権利であり、周囲は自分を輝かせるための背景に過ぎないと感じることがある。", f: {D:1, E:0.5} },
        { t: "集団の中で誰かが孤立していても、自分の立場が脅かされない限り、その状況を冷ややかに傍観できる。", f: {E:1} },
        { t: "ルールや法律は、頭の回転が遅い凡人を縛るためのものであり、優れた人間にはそれを超越する権利がある。", f: {D:1, C:1} },
        { t: "自分の目的達成を阻む者がいれば、合法的な手段の範囲内で徹底的に排除することに躊躇はしない。", f: {M:1, D:0.5} },
        { t: "会話の主導権を握り、相手の思考や感情が自分の誘導通りに動く瞬間、形容しがたい万能感を覚える。", f: {D:1, S:0.5} },
        { t: "相手によって声のトーンや性格を完璧に使い分けており、自分でも「本当の自分」がどこにいるのか分からなくなる時がある。", f: {S:1, M:0.5} },
        { t: "激しい怒りを感じた時、相手の自尊心が二度と再生できないほど、言葉の刃で徹底的に破壊したくなる衝動がある。", f: {C:1, E:0.5} },
        { t: "安定した平穏な日常は、ゆっくりとした精神的死と同じであり、常に破壊や混乱の火種を求めている。", f: {C:1, D:0.5} },
        { t: "他人の秘密を握ることは、自分を守るための最強の武器を手に入れたような安心感をもたらす。", f: {M:1, D:0.5} },
        { t: "組織の中で誰が「実権」を握り、誰が「駒」であるかを嗅ぎ分ける能力は、誰よりも優れている自信がある。", f: {M:1, S:1} },
        { t: "失敗した際、反省するよりも先に「誰に、あるいは何に責任を転嫁すれば最も効率的に回避できるか」を考える。", f: {M:1, E:0.5} },
        { t: "自分が注目の中心でないイベントや集まりには、参加する価値を一切感じない。", f: {D:1, S:0.5} },
        { t: "世間で「感動的」とされる物語を見ても、プロットのあざとさばかりが目につき、冷めた視線で見てしまう。", f: {E:1, C:0.5} },
        { t: "「バレなければ何をしても良い」という考え方は、生物としての生存本能に忠実な、極めて合理的な判断だと思う。", f: {M:1, E:1} },
        { t: "人が嫌がる仕事を他人に押し付け、自分だけが利益を享受することに、一種の知的な勝利感を感じる。", f: {M:1, S:0.5} },
        { t: "初対面の相手に対し、「こいつは利用できるか、それとも敵になるか」という二極化された評価を瞬時に下す。", f: {M:1, E:0.5} },
        { t: "自分が犯した過ちであっても、被害者のように振る舞うことで周囲の同情を誘い、責任をうやむやにしたことがある。", f: {M:1, S:1} },
        { t: "鏡を見て自分の容姿や能力を自画自賛する時間は、何よりも心が満たされる瞬間である。", f: {D:1} },
        { t: "SNSでの炎上事件を見ると、その惨状をどこかワクワクしながら眺め、匿名でガソリンを注ぎたくなる。", f: {C:1, E:1} },
        { t: "誰とでも仲良く振る舞うことができるが、心から信頼し、自分の全てを晒せる人間は一人もいない。", f: {S:1, E:1} },
        { t: "恩を着せるのは、将来的にその相手を自分のコントロール下に置くための「精神的な鎖」を作るためだ。", f: {M:1, D:1} },
        { t: "自分を否定する人間は、正しさに関係なく「排除すべき敵」として脳内のリストに登録される。", f: {D:1, E:0.5} },
        { t: "締め切りや規律を守ることよりも、その場の衝動や快楽を優先して行動することに悦びを感じる。", f: {C:1} },
        { t: "他人の感情を逆撫でするような発言をわざと行い、その反応を見て楽しむ悪癖がある。", f: {C:1, E:1} },
        { t: "高価な品物を手に入れることよりも、それを手に入れる過程で他人を出し抜くことの方に価値を感じる。", f: {M:1, D:0.5} },
        { t: "集団の中にいるとき、常に「最悪の場合、誰を切り捨てれば自分が助かるか」をシミュレーションしている。", f: {S:1, M:1} },
        { t: "過去の栄光を何度も語り直し、他人から羨望の眼差しを向けられることが何よりの栄養源だ。", f: {D:1, S:0.5} },
        { t: "自分という存在を特別な「選ばれし者」であると、根拠なく強く信じている。", f: {D:1, C:0.5} },
        { t: "弱みを見せることは敗北であり、死んでも他人には悟られないように徹底的に武装している。", f: {S:1, D:0.5} },
        { t: "他人が苦労して築き上げたものを、一瞬で台無しにする破壊衝動に駆られることがある。", f: {C:1, E:0.5} },
        { t: "法律のグレーゾーンを歩くことにスリルを感じ、捕まらない自分は賢いと自惚れている。", f: {M:1, C:1} },
        { t: "自分がいない場所で他人が楽しそうにしていると、強い不快感と疎外感を覚え、その和を乱したくなる。", f: {S:1, D:0.5} },
        { t: "「愛している」という言葉は、相手を繋ぎ止めるための便利なツールに過ぎない。", f: {M:1, S:1} },
        { t: "他人のプライバシーや領域に踏み込み、相手が困惑する様子を見ることに快感を覚える。", f: {E:1, C:0.5} },
        { t: "感情を爆発させることで周囲を威圧し、自分の思い通りに状況を動かした経験が何度もある。", f: {D:1, C:0.5} },
        { t: "どれほど親しい相手であっても、自分の利益と相反するならば、躊躇なく切り捨てることができる。", f: {E:1, M:1} },
        { t: "人の悩みを聞いているふりをしながら、頭の中では全く別の楽しいことを考えている。", f: {E:1, S:0.5} },
        { t: "自分を高く評価しない組織や社会そのものが間違っており、いつか壊滅すればいいと願っている。", f: {D:1, C:1} },
        { t: "他人の成功は運によるものだが、自分の成功は純粋な実力によるものだと確信している。", f: {D:1, E:0.5} },
        { t: "禁止されている行為ほど、その背徳感に抗いがたい魅力を感じて実行に移してしまう。", f: {C:1, M:0.5} },
        { t: "他人の人生を狂わせるような噂話を、善意の顔をして広めることに快感を覚える。", f: {M:1, E:1} },
        { t: "自分は誰よりも繊細で傷つきやすい被害者であると同時に、誰をも支配できる強者であるという矛盾を抱えている。", f: {D:1, S:1} },
        { t: "この世界そのものが壮大なゲームであり、自分以外の人間は全てNPC（ノンプレイヤーキャラクター）のように思える。", f: {E:1, D:1} }
    ];

    const typeData = {
        "MS": {
            name: "情報詐欺師",
            catch: "「真実とは、最も都合の良い嘘のことだ。」",
            core: "あなたは言葉という見えない糸で、他人の認識を自在に編み変える魔術師です。事実そのものには価値を置かず、その事実が『どう見えるか』を徹底的に操作します。あなたの前では、どんな強固な信念を持つ者も、いつの間にかあなたの引いたレールの上を歩かされていることに気づきません。高い知能と演技力が融合した、極めて洗練された犯罪者マインドの持ち主です。",
            strength: "圧倒的な説得力と、敵対する者さえも味方に変える「物語構築能力」。複雑な利害関係を読み解き、自分だけが利益を得る構造を瞬時に設計できる知略。",
            risk: "自分のついた嘘と現実の境界が曖昧になり、自分自身さえも信じられなくなる深刻なアイデンティティの喪失。真の信頼関係を一度も築けぬまま終わる孤独。"
        },
        "ED": {
            name: "評判の暗殺者",
            catch: "「正義の仮面ほど、残酷な処刑道具はない。」",
            core: "あなたは他人の「欠点」や「恥部」を見つけ出し、それを社会的な正義という大義名分を使って断罪することに長けています。あなたの攻撃は物理的な痛みではなく、相手の社会的な尊厳を根底から破壊します。冷徹な観察眼で相手の急所を見極め、一言で致命傷を与えるその姿は、法の網を潜り抜ける現代の処刑人と言えるでしょう。",
            strength: "他人の欺瞞を暴く異常なまでの洞察力。冷静沈着な分析に基づき、最小の労力で最大のダメージを与える「言葉の効率性」。",
            risk: "他人を裁くことでしか自己を保てなくなり、常に他人の不幸を糧にする精神的渇望。いつか自分も同じように断罪されるという、終わりのない被害妄想。"
        },
        // ... 他のタイプも同様に圧倒的な文章量で実装されます
    };

    let currentIdx = 0;
    let scores = { M: 0, E: 0, D: 0, C: 0, S: 0 };

    function startQuiz() {
        document.getElementById('bgm').play().catch(()=>{});
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQ();
    }

    function showQ() {
        const q = questions[currentIdx];
        const el = document.getElementById('q-text');
        document.getElementById('q-number').innerText = `NODE: [0x${(currentIdx + 1).toString(16).toUpperCase()}] SCANNING DEEP PSYCHE...`;
        
        el.innerText = "";
        let i = 0;
        const timer = setInterval(() => {
            el.innerText += q.t.charAt(i);
            i++;
            if (i >= q.t.length) clearInterval(timer);
        }, 35);
    }

    function handleAnswer(isYes) {
        document.querySelector('.screen').classList.add('glitch-active');
        setTimeout(() => document.querySelector('.screen').classList.remove('glitch-active'), 200);

        if(isYes) {
            const f = questions[currentIdx].f;
            for(let k in f) scores[k] += f[k];
        }
        currentIdx++;
        if(currentIdx < questions.length) setTimeout(showQ, 250);
        else processResult();
    }

    function processResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('loading-screen').classList.remove('hidden');
        const msg = document.getElementById('load-msg');
        const logs = ["神経網をハッキング中...", "倫理回路の完全停止を確認...", "潜在的犯罪因子の抽出...", "解析完了：あなたの本性です。"];
        let i = 0;
        const interval = setInterval(() => {
            msg.innerText = logs[i];
            i++;
            if(i >= logs.length) {
                clearInterval(interval);
                setTimeout(displayFinal, 1200);
            }
        }, 1200);
    }

    function displayFinal() {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
        const key = sorted[0][0] + (sorted[1] ? sorted[1][0] : sorted[0][0]);
        const data = typeData[key] || typeData["MS"];

        document.getElementById('res-type').innerText = data.name;
        document.getElementById('res-catch').innerText = data.catch;
        document.getElementById('res-core').innerText = data.core;
        document.getElementById('res-strength').innerText = data.strength;
        document.getElementById('res-risk').innerText = data.risk;
        document.getElementById('res-img').src = `images/${key}.jpg`;

        setTimeout(() => {
            document.getElementById('final-message').style.display = 'block';
            typeFinalText();
        }, 2000);
    }

    function typeFinalText() {
        const text = `お疲れ様でした。\nあなたが手にした結果は、あなたが厳しい現実を生き抜くために無意識に研ぎ澄ませてきた「生存戦略としての影」です。\n\n世の中には「自分は善良である」と信じ込むことで思考を停止させている無知な羊たちが大勢います。しかし、あなたは違う。あなたは自らの内側に潜む「獣」の存在を知り、それを知性という檻で飼い慣らしているに過ぎません。\n\nその鋭い牙を、誰かを踏み台にするためだけに使うか、あるいは停滞した世界を打ち破るための楔として使うか。それを決めるのは、今この結果を読んでいるあなたの意志です。影が濃いということは、それだけあなたの光が強烈であることを意味します。\n\nさあ、その仮面を整えて外へ戻りなさい。あなたの闇が、今日から誰かの欺瞞を暴く光になるかもしれません。`;
        const el = document.getElementById('final-text');
        let i = 0;
        const timer = setInterval(() => {
            if (text.charAt(i) === '\n') el.innerHTML += '<br>';
            else el.innerHTML += text.charAt(i);
            i++;
            if (i >= text.length) {
                clearInterval(timer);
                document.getElementById('reset-btn').style.display = 'block';
            }
        }, 45);
    }
</script>
</body>
</html>
