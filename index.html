<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE ABYSS - 深層心理の深淵</title>
    <style>
        :root {
            --bg-color: #030303;
            --accent-color: #aa0000;
            --rare-color: #ff0000;
            --text-color: #d0d0d0;
            --card-bg: rgba(10, 10, 10, 0.98);
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', 'Arial', 'Hiragino Sans', 'Meiryo', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 1000;
            background-size: 100% 3px;
            pointer-events: none;
        }

        #app { width: 95%; max-width: 850px; z-index: 10; padding: 10px; box-sizing: border-box; }
        
        .screen { 
            background: var(--card-bg); 
            border: 1px solid #333; 
            padding: 30px; 
            box-shadow: 0 0 80px rgba(170, 0, 0, 0.15); 
            box-sizing: border-box;
            width: 100%;
        }

        h1 { color: var(--accent-color); text-align: center; letter-spacing: 12px; font-size: 2.5rem; margin-bottom: 30px; text-shadow: 0 0 10px rgba(170, 0, 0, 0.5); }
        
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .q-number { font-size: 0.8rem; color: var(--accent-color); font-weight: bold; letter-spacing: 2px; }
        .question-text { font-size: 1.3rem; line-height: 1.8; min-height: 160px; margin-bottom: 30px; color: #eee; }

        .btn-container { display: flex; gap: 20px; }
        button { 
            flex: 1; background: transparent; color: #888; border: 1px solid #444; 
            padding: 18px; cursor: pointer; font-family: inherit; font-size: 1rem; 
            transition: 0.3s; position: relative; overflow: hidden;
        }
        button:hover { color: var(--accent-color); border-color: var(--accent-color); background: rgba(170,0,0,0.1); }

        .evidence-frame {
            position: relative;
            width: 100%;
            height: 450px;
            background: #111;
            margin-bottom: 10px;
            border: 1px solid #444;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .evidence-frame.error-state {
            background-image: repeating-radial-gradient(circle at center, #111, #000 1px);
            background-size: 4px 4px;
        }
        .error-msg {
            display: none;
            color: var(--accent-color);
            font-family: monospace;
            text-align: center;
            z-index: 10;
            font-weight: bold;
            letter-spacing: 2px;
            animation: blink 0.2s infinite;
        }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.7;} 100% {opacity: 1;} }

        .result-img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.8) brightness(0.7) contrast(1.2); z-index: 2; }
        
        .corner { position: absolute; width: 20px; height: 20px; border: 2px solid var(--accent-color); z-index: 5; }
        .top-l { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .top-r { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .bot-l { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .bot-r { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        .evidence-info {
            position: absolute; bottom: 20px; left: 45px; color: var(--accent-color);
            font-size: 0.7rem; font-family: monospace; z-index: 5; line-height: 1.4;
            text-shadow: 1px 1px 2px #000;
        }
        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 4rem; color: rgba(170, 0, 0, 0.15); font-weight: bold;
            pointer-events: none; white-space: nowrap; letter-spacing: 10px; z-index: 4;
        }

        .ratio-container { text-align: center; margin-bottom: 25px; }
        .ratio-badge { background: var(--accent-color); color: #fff; padding: 2px 12px; font-size: 0.7rem; letter-spacing: 2px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .special-msg { font-size: 0.95rem; color: #fff; font-style: italic; line-height: 1.6; text-shadow: 0 0 5px rgba(255,255,255,0.2); }

        #flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 2000; opacity: 0; pointer-events: none;
        }
        @keyframes shutter {
            0% { opacity: 0; }
            20% { opacity: 1; }
            100% { opacity: 0; }
        }

        .type-title { color: var(--accent-color); font-size: 2.5rem; margin-bottom: 5px; text-align: center; font-weight: bold; }
        .type-subtitle { color: #888; text-align: center; margin-bottom: 30px; font-size: 1rem; letter-spacing: 2px; }
        
        .section-title { color: #fff; font-size: 0.9rem; margin-top: 30px; background: linear-gradient(90deg, var(--accent-color), transparent); padding: 5px 15px; letter-spacing: 2px; font-weight: bold; }
        .section-content { font-size: 1rem; line-height: 1.8; color: #bbb; margin-bottom: 15px; padding: 10px 5px; text-align: justify; }

        .rare-effect { animation: pulse-rare 2s infinite; border: 1px solid var(--rare-color) !important; }
        @keyframes pulse-rare {
            0% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.2); }
            50% { box-shadow: 0 0 50px rgba(255, 0, 0, 0.5); }
            100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.2); }
        }

        .hidden { display: none; }
        
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem !important; letter-spacing: 6px !important; }
            .question-text { font-size: 1.1rem !important; min-height: 120px !important; }
            .btn-container { flex-direction: column; gap: 10px !important; }
            .screen { padding: 20px; }
            .type-title { font-size: 1.8rem !important; }
            .evidence-frame { height: 300px !important; }
        }
    </style>
</head>
<body>

<div id="flash"></div>
<audio id="bgm" loop preload="auto"><source src="bgm.mp3" type="audio/mpeg"></audio>

<div id="app">
    <div id="start-screen" class="screen">
        <h1>THE ABYSS</h1>
        <p style="text-align: center; color: #888; margin-bottom: 40px; line-height: 2; font-size: 0.9rem;">
            [ SYSTEM NOTIFICATION ]<br>
            これよりあなたの脳内領域へアクセスし、50のプロトコルを走らせます。<br>

            あなたの「本性」が暴かれるまで、残り50問。
        </p>
        <button onclick="startQuiz()">システムを起動する</button>
    </div>

    <div id="quiz-screen" class="screen hidden">
        <div class="q-header">
            <div class="q-number" id="q-number"></div>

        </div>
        <div class="question-text" id="q-text"></div>
        <div class="btn-container">
            <button onclick="handleAnswer(true)">YES (肯定)</button>
            <button onclick="handleAnswer(false)">NO (否定)</button>
        </div>
    </div>

    <div id="loading-screen" class="screen hidden">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px;">
            <div id="load-msg" style="text-align: center; color: var(--accent-color); font-size: 1rem; letter-spacing: 3px; margin-bottom: 20px;"></div>
            <div id="progress-bar" style="width: 100%; height: 2px; background: #222; position: relative;">
                <div id="progress-inner" style="width: 0%; height: 100%; background: var(--accent-color); transition: width 0.3s;"></div>
            </div>
        </div>
    </div>

    <div id="result-screen" class="screen hidden">
        <div class="evidence-frame" id="img-container">
            <div class="corner top-l"></div><div class="corner top-r"></div>
            <div class="corner bot-l"></div><div class="corner bot-r"></div>

        <div class="ratio-container">

            <div id="res-special-msg" class="special-msg"></div>
        </div>

        <div id="res-type" class="type-title"></div>
        <div id="res-catch" class="type-subtitle"></div>
        
        <div class="section-title">■ 深層心理プロファイル</div>
        <div id="res-core" class="section-content"></div>
        <div class="section-title">■ 社会的仮面（ペルソナ）と裏の顔</div>
        <div id="res-persona" class="section-content"></div>
        <div class="section-title">■ 人間関係における支配傾向</div>
        <div id="res-relation" class="section-content"></div>
        <div class="section-title">■ 闇の適職と成功への鍵</div>
        <div id="res-career" class="section-content"></div>
        <div class="section-title">■ 破滅のトリガー</div>
        <div id="res-risk" class="section-content"></div>

        <div id="final-message-container" style="margin-top: 50px; border-top: 1px double #444; padding-top: 30px;">
            <div style="color: var(--accent-color); font-size: 0.7rem; letter-spacing: 3px; margin-bottom: 15px; text-align: center;">[ FINAL PROTOCOL ]</div>
            <div id="res-final-text" style="font-size: 0.95rem; line-height: 2; color: #fff; text-align: justify; font-style: italic; background: rgba(170, 0, 0, 0.05); padding: 20px; border-radius: 5px;"></div>
        </div>

<!-- 共有セクションの追加 -->
<div id="share-section" style="margin-top: 30px; text-align: center; background: rgba(170, 0, 0, 0.1); padding: 20px; border: 1px solid var(--accent-color);">
    <div style="font-size: 0.8rem; color: var(--accent-color); letter-spacing: 2px; margin-bottom: 15px;">[ DATA EXPORT / SHARE ]</div>

    <div style="display: flex; gap: 5px; margin-bottom: 15px;">

        <button onclick="copyURL()" style="flex: none; width: auto; padding: 0 15px; font-size: 0.7rem; border-color: var(--accent-color);">COPY</button>
    </div>

    <button onclick="shareX()" style="background: #000; color: #fff; border: 1px solid #fff; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
        Xで深淵を共有する
    </button>
</div>

<script>
// 共有用のスクリプト
function copyURL() {
    const copyTarget = document.getElementById("share-url");
    copyTarget.value = window.location.href; // 現在のURLをセット
    copyTarget.select();
    document.execCommand("Copy");
    alert("URLをクリップボードにコピーしました。");
}

function shareX() {
    const typeName = document.getElementById("res-type").innerText;
    const catchPhrase = document.getElementById("res-catch").innerText;
    const url = window.location.href;
    const text = `【THE ABYSS - 深層心理の深淵】\n私の本性は…『${typeName}』\n${catchPhrase}\n\n#THE_ABYSS #深層心理診断\n`;
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
}

        "SE": { name: "見えない窃盗犯", ratio: "出現率 3.5%", isRare: false, specialMsg: "1000人集まっても35人程度。あなたの観察眼はもはや特殊技能の域です。", catch: "「失ったことさえ気づかないうちに、すべては私の手の中にある。」", core: "静寂の中に潜み、他者が大切にしている機会を奪い去る潜伏型の捕食者です。", persona: "害のない善良な人間を演じ、空気のように存在感を消して機密を吸収します。", relation: "深い関わりを避けつつ弱みを握ります。信頼という名の鍵を開ける名手。", career: "スパイ、情報仲介人、裏社会の会計士。", risk: "誰からも認識されない究極の孤独に陥り、透明な幽霊となって消える恐怖。" },

        "SM": { name: "仮面の偽造師", ratio: "出現率 14.0%", isRare: false, specialMsg: "全人口の14%に該当。高い社会性を持ち、周囲と摩擦なく目的を遂げる理知的なタイプ。", catch: "「本物の私？ それは今、あなたが鏡で見ている顔のことだ。」", core: "相手が望む人格を演じ分ける魔術師。あなたの素顔は漆黒の深淵です。", persona: "ターゲットの好みに合わせて人格を1秒で再構成。変幻自在です。", relation: "相手はあなたを唯一の理解者と信じますが、あなたは鏡像を模倣しているだけです。", career: "超一流の詐欺師、潜入捜査官、名俳優。", risk: "自分が誰であるかを完全に忘却し、空っぽの器しか残っていない精神的死。" },
        "ME": { name: "冷徹な密輸商", ratio: "出現率 7.5%", isRare: false, specialMsg: "全人口の約7.5%に該当。感情に流されないその決断力は、プロの証です。", catch: "「禁忌を運ぶのに、感情ほど邪魔な荷物はない。」", core: "道徳的に禁じられた情報や感情を、合理的に取引する闇の商人です。", persona: "礼儀正しいビジネスマン。瞳には生命への敬意が欠如し、すべてを利益率で判定します。", relation: "すべてが契約に基づきます。感情的な債務を許しません。", career: "闇サイト運営、武器商人、非合法な情報屋。", risk: "合理性を突き詰めた結果、生きる意味さえ見失い、データの一部として消滅するリスク。" },
        "DE": { name: "共鳴のカルト教祖", ratio: "出現率 7.0%", isRare: false, specialMsg: "100人中7人しかいない、希少なカリスマ。人を惹きつける天賦の才能です。", catch: "「救いとは、私という深淵にすべてを投げ出すことだ。」", core: "孤独な魂の隙間に滑り込み、支配という救済を与える精神簒奪者です。", persona: "圧倒的な包容力。弱者を惹きつける慈愛の仮面を被っています。", relation: "信者と教祖。自己肯定感を破壊した後に全肯定を与え、服従を強います。", career: "スピリチュアル指導者、ブラック企業の経営者。", risk: "崇拝者がいなくなれば自分を定義できなくなる恐怖。" },
        "CE": { name: "背徳のギャンブラー", ratio: "出現率 3.0%", isRare: false, specialMsg: "世界のわずか3%しか持ち得ない純粋なリスク志向。破滅を恐れぬ勇姿です。", catch: "「破滅の直前、人は最も美しく輝く。」", core: "自分と他人の人生をチップにして、危険な賭けに興じるスリル中毒者です。", persona: "退廃的で刹那的な快楽主義者。抗いがたいデカダンスな魅力を放ちます。", relation: "相手を道連れにする破滅的な関係。壊されることでしか愛を実感できません。", career: "ハイリスクな投資家、危険地帯ジャーナリスト、破滅型アーティスト。", risk: "誰からも顧みられない路地裏での野垂れ死に。あるいは自死。" },
        "SD": { name: "多重スパイ", ratio: "出現率 11.5%", isRare: false, specialMsg: "約10人に1人の結果。組織の中核を担う人々に多い、バランスの取れた戦略家の証です。", catch: "「誰の味方でもない。私が味方するのは、常に『勝利』だけだ。」", core: "複数の顔を持ち、双方をコントロールする均衡の支配者。正体は誰にも掴めません。", persona: "有能な部下、信頼できる友人。提供する情報は毒が混ぜられた誘導灯です。", relation: "常に裏切りの準備。どれほど親密でも、心の最深部には誰も入れません。", career: "情報機関、Ｍ＆Ａ仲介、政界のフィクサー。", risk: "恒久的な帰属意識の欠如。" },
        "CS": { name: "異端のリバタリアン", ratio: "出現率 0.7%", isRare: true, specialMsg: "【警告：超希少種】約1万人に7人の存在。現代社会では制御不能な究極の個人主義者。", catch: "「自由を阻むものは、神であれ王であれ焼き払う。」", core: "あらゆる秩序や道徳を憎悪する無政府主義者。「個」としての完成を求めます。", persona: "物静かな個人主義者。しかし内側には傲慢な自律心が渦巻いています。", relation: "絆を「脆弱さ」として拒絶。必要な時だけ接続し、即座に切断します。", career: "ハッカー、異端の哲学者、孤独なテロリスト。", risk: "完全な自由の果てにある絶対的な虚無。" },
        "ES": { name: "沈黙の処刑人", ratio: "出現率 0.9%", isRare: true, specialMsg: "【警告：超希少種】約1万人に9人の逸材。システムに近い存在であることを示しています。", catch: "「言葉による弁明は不要だ。結果がすべてを裁く。」", core: "感情を完全に排し、事務的に他人の人生を終わらせることができる執行者です。", persona: "感情の起伏が見えない鋼の仮面。死神に近い静謐なプレッシャーを与えます。", relation: "人間味を排除した機能的な繋がり。愛を知る前に、効率を理解しました。", career: "整理解雇担当、過酷な刑罰の執行官、暗殺者。", risk: "心が完全に石化し、自分が生きているのか判別できない生ける屍となること。" },
        "DM": { name: "強欲な徴収官", ratio: "出現率 3.5%", isRare: false, specialMsg: "成功への渇望が人一倍強い、富を独占する資格を持つ実力者の一人です。", catch: "「あなたの価値は、私がどれだけ搾り取れるかで決まる。」", core: "他人の労力を自分の未回収資産だと認識している強欲な略略者です。", persona: "面倒見の良いパトロン。その正体は1滴の血まで利子をつけて奪う吸血鬼です。", relation: "相手を債務者のように扱い、精神的に奴隷化することを楽しみます。", career: "冷酷な高利貸し、搾取型プラットフォーム創設、遺産略奪者。", risk: "底なしの飢餓感。" },
        "EC": { name: "虚無の破壊者", ratio: "出現率 0.5%", isRare: true, specialMsg: "【警告：最希少種】2万人に1人の特異点。深淵の底まで到達したその虚無感。", catch: "「美しいものは、粉々に砕ける時に最も完成される。」", core: "形あるものを無意味という深淵へ叩き落とす純粋な破壊者です。", persona: "現世に全く興味がない雰囲気。文明や秩序を崩壊させる隙を狙っています。", relation: "他者が大切にしているものを踏みにじり、絶望する反応を観察します。", career: "市場破壊者、解体屋、破壊芸術家、終末論者。", risk: "自分自身を破壊する以外に道がなくなる究極のニヒリズム。" }
    };

    let currentIdx = 0;
    let scores = { M: 0, E: 0, D: 0, C: 0, S: 0 };

    function preloadImages() {
        Object.keys(typeData).forEach(key => {
            const img = new Image();
            img.src = `images/${key}.jpg`;
        });
    }

    function handleImageError(img) {
        if (!img.dataset.retried) {
            img.dataset.retried = "true";
            setTimeout(() => {
                const key = img.src.split('/').pop().split('.')[0];
                if(key && key !== "") img.src = `images/${key}.jpg`;
            }, 1000);
        } else {
            const frameEl = document.getElementById('img-container');
            const errorMsg = document.getElementById('res-error-msg');
            img.style.display = 'none';
            frameEl.classList.add('error-state');
            errorMsg.style.display = 'block';
        }
    }

    function startQuiz() {
        preloadImages();
        const bgm = document.getElementById('bgm');
        bgm.volume = 0.4;
        bgm.play().catch(()=>{});
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQ();
    }

    function showQ() {
        const q = questions[currentIdx];
        const el = document.getElementById('q-text');
        const status = document.getElementById('status-display');
        document.getElementById('q-number').innerText = `PROTOCOL NO. ${String(currentIdx + 1).padStart(2, '0')} / 50`;
        
        if(currentIdx > 10) status.innerText = "STATUS: ANALYZING TEMPERAMENT...";
        if(currentIdx > 30) status.innerText = "STATUS: PEELING PERSONA...";
        if(currentIdx > 45) status.innerText = "STATUS: ACCESSING CORE...";

        el.innerText = "";
        let i = 0;
        const timer = setInterval(() => {
            el.innerText += q.t.charAt(i);
            i++;
            if (i >= q.t.length) clearInterval(timer);
        }, 25);
    }

    function handleAnswer(isYes) {
        const q = questions[currentIdx];
        if(isYes && q.fy) {
            for(let k in q.fy) scores[k] += q.fy[k];
        } else if(!isYes && q.fn) {
            for(let k in q.fn) scores[k] += q.fn[k];
        }
        currentIdx++;
        if(currentIdx < questions.length) showQ();
        else processResult();
    }

    function processResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('loading-screen').classList.remove('hidden');
        
        const msg = document.getElementById('load-msg');
        const bar = document.getElementById('progress-inner');
        const logs = ["倫理回路バイパス中...", "潜在理性スキャン中...", "防衛本能剥離完了...", "深層データ復元率 92%...", "深淵との同期完了。"];
        
        let i = 0;
        const interval = setInterval(() => {
            msg.innerText = logs[i];
            bar.style.width = `${(i + 1) * 20}%`;
            i++;
            if(i >= logs.length) {
                clearInterval(interval);
                setTimeout(displayFinal, 1200);
            }
        }, 800);
    }

    function displayFinal() {
        const flash = document.getElementById('flash');
        flash.style.animation = 'shutter 0.5s ease-out';
        
        document.getElementById('loading-screen').classList.add('hidden');
        const resScreen = document.getElementById('result-screen');
        resScreen.classList.remove('hidden');
        
        // 判定ロジックをより堅牢に修正
        const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
        
        // スコアが全く同じ場合を考慮し、デフォルト値を設定
        let char1 = sorted[0] ? sorted[0][0] : "M";
        let char2 = sorted[1] ? sorted[1][0] : "S";
        
        let key = char1 + char2;
        
        // 組み合わせが存在しない場合の逆引き
        if (!typeData[key]) {
            key = char2 + char1;
        }
        // それでもない場合の最終フォールバック
        if (!typeData[key]) {
            key = "MS";
        }
        
        const data = typeData[key];

        if(data.isRare) {
            resScreen.classList.add('rare-effect');
            document.documentElement.style.setProperty('--accent-color', 'var(--rare-color)');
        }

        const imgEl = document.getElementById('res-img');
        imgEl.src = `images/${key}.jpg`;
        
        document.getElementById('res-type').innerText = data.name;
        document.getElementById('res-catch').innerText = data.catch;
        document.getElementById('res-ratio').innerText = data.ratio;
        document.getElementById('res-special-msg').innerText = data.specialMsg;
        document.getElementById('res-core').innerText = data.core;
        document.getElementById('res-persona').innerText = data.persona;
        document.getElementById('res-relation').innerText = data.relation;
        document.getElementById('res-career').innerText = data.career;
        document.getElementById('res-risk').innerText = data.risk;

        const finalText = `診断お疲れ様でした。あなたが直視したその姿は、社会があなたに押し付けた「善人」という化けの皮を剥ぎ取った、魂の原型です。\n\nこのアビス（深淵）が示したのは、あなたが窮地に立たされた時に発動する「真の生存戦略」に他なりません。悪と呼ばれようと、闇と呼ばれようと、それはあなたがこの残酷な世界を生き抜くために獲得した最強の武器なのです。\n\nさあ、その特別な「牙」を持って、外の世界に戻りなさい。`;
        document.getElementById('res-final-text').innerHTML = finalText.replace(/\n/g, '<br>');
        
        const date = new Date();
        const dateStr = `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
        document.getElementById('evidence-meta').innerHTML = `SCAN_TIME: ${dateStr}<br>SUBJECT_ID: ABYSS-${Math.floor(Math.random()*9000)+1000}<br>STATUS: VERIFIED`;
    }
</script>
